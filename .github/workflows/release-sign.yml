name: Release signer

on:
  workflow_call:

permissions:
  contents: read

jobs:
  sign:
    name: Attest release assets
    runs-on: ubuntu-latest
    environment: release-signing
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: release-assembly
          path: sign-input
      - name: Validate immutable public release closure
        shell: bash
        env:
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          CALLER_WORKFLOW_SHA: ${{ github.workflow_sha }}
          REPOSITORY_VISIBILITY: ${{ github.repository_visibility }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = Fuxx-1/git-vws
          test "$GITHUB_EVENT_NAME" = push
          test "$REPOSITORY_VISIBILITY" = public
          [[ "$GITHUB_REF" == refs/tags/v* ]]
          test "$GITHUB_REF_NAME" = "${GITHUB_REF#refs/tags/}"
          test "$CALLER_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF"
          test "$CALLER_WORKFLOW_SHA" = "$GITHUB_SHA"
          test -d sign-input/assets
          test -z "$(find sign-input -type l -print -quit)"
          python3 - sign-input/assets "$GITHUB_REF_NAME" <<'PY'
          import hashlib
          import re
          import sys
          from pathlib import Path

          assets = Path(sys.argv[1])
          tag = sys.argv[2]
          if not re.fullmatch(
              r"v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z]+(?:[0-9A-Za-z.-]*[0-9A-Za-z])?)?",
              tag,
          ):
              raise SystemExit("release tag is not a semantic version")
          version = tag[1:]
          prefix = f"git-vws-v{version}"
          targets = {
              "aarch64-apple-darwin",
              "x86_64-apple-darwin",
              "x86_64-unknown-linux-musl",
          }
          archives = {f"{prefix}-{target}.tar.gz" for target in targets}
          expected = archives | {f"{name}.sha256" for name in archives} | {
              "SHA256SUMS",
              f"{prefix}.spdx.json",
              "THIRD-PARTY-LICENSES.txt",
              "BUILD-METADATA.json",
          }
          actual = {path.name for path in assets.iterdir()}
          if actual != expected:
              raise SystemExit(
                  f"unsigned release closure mismatch: actual={sorted(actual)} "
                  f"expected={sorted(expected)}"
              )
          for path in assets.iterdir():
              if not path.is_file() or path.is_symlink():
                  raise SystemExit(f"release member is not a regular file: {path.name}")

          def sha256(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          manifest_members = sorted(expected - {"SHA256SUMS"})
          manifest = "".join(
              f"{sha256(assets / name)}  {name}\n" for name in manifest_members
          )
          if (assets / "SHA256SUMS").read_text(encoding="ascii") != manifest:
              raise SystemExit("combined checksum manifest is invalid")
          for archive in archives:
              line = f"{sha256(assets / archive)}  {archive}\n"
              if (assets / f"{archive}.sha256").read_text(encoding="ascii") != line:
                  raise SystemExit(f"archive checksum is invalid: {archive}")
          PY
      - id: attest
        name: Generate public Sigstore provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: sign-input/assets/*
      - name: Retain the exact public attestation bundle
        shell: bash
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -f "$BUNDLE_PATH"
          cp "$BUNDLE_PATH" sign-input/assets/PROVENANCE.sigstore.json
          python3 - sign-input/assets/PROVENANCE.sigstore.json <<'PY'
          import base64
          import json
          import sys

          bundle = json.load(open(sys.argv[1], encoding="utf-8"))
          if bundle.get("mediaType") != (
              "application/vnd.dev.sigstore.bundle.v0.3+json"
          ):
              raise SystemExit("Sigstore bundle media type is invalid")
          material = bundle.get("verificationMaterial")
          if not isinstance(material, dict) or "publicKey" in material:
              raise SystemExit("Sigstore bundle is not certificate-backed")
          certificate = material.get("certificate")
          if not isinstance(certificate, dict):
              raise SystemExit("Sigstore bundle omitted its signing certificate")
          raw = certificate.get("rawBytes")
          if not isinstance(raw, str) or base64.b64decode(raw, validate=True)[:1] != b"0":
              raise SystemExit("Sigstore signing certificate is invalid")
          entries = material.get("tlogEntries")
          if not isinstance(entries, list) or not entries:
              raise SystemExit("Sigstore bundle omitted transparency-log evidence")
          envelope = bundle.get("dsseEnvelope")
          if not isinstance(envelope, dict):
              raise SystemExit("Sigstore bundle omitted its DSSE envelope")
          if envelope.get("payloadType") != "application/vnd.in-toto+json":
              raise SystemExit("Sigstore bundle payload type is invalid")
          signatures = envelope.get("signatures")
          if not isinstance(signatures, list) or len(signatures) != 1:
              raise SystemExit("Sigstore bundle signature count is invalid")
          PY
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: release-signed
          path: sign-input/assets
          if-no-files-found: error
          retention-days: 1
