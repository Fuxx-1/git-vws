name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          set-safe-directory: false
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --all-targets
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  linux-musl:
    name: Linux musl release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          set-safe-directory: false
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - run: cargo build --locked --release --target x86_64-unknown-linux-musl
      - name: Verify Git extension entry point
        shell: bash
        run: |
          target/x86_64-unknown-linux-musl/release/git-vws --version
          PATH="$PWD/target/x86_64-unknown-linux-musl/release:$PATH" git vws -h

  macos:
    name: macOS APFS (${{ matrix.asset }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            asset: aarch64-apple-darwin
            arch: arm64
          - os: macos-15-intel
            asset: x86_64-apple-darwin
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          set-safe-directory: false
      - name: Record Git isolation evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runner-evidence
          relevant_config='^(filter|lfs|include(if)?)\.|^core\.attributesfile$'
          record_scope() {
            local scope="$1"
            local output="$2"
            local status
            if git config "$scope" --includes --name-only \
              --get-regexp "$relevant_config" > "$output"; then
              return 0
            else
              status=$?
            fi
            if [ "$status" -ne 1 ]; then
              return "$status"
            fi
            return 0
          }
          record_scope --global runner-evidence/git-config-global-relevant.txt
          record_scope --system runner-evidence/git-config-system-relevant.txt
          isolated_xdg="$RUNNER_TEMP/git-vws-empty-xdg"
          mkdir -p "$isolated_xdg"
          test -z "$(find "$isolated_xdg" -mindepth 1 -maxdepth 1 -print -quit)"
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_CONFIG_GLOBAL=/dev/null
          export GIT_ATTR_NOSYSTEM=1
          export XDG_CONFIG_HOME="$isolated_xdg"
          test "$GIT_CONFIG_NOSYSTEM" = 1
          test "$GIT_CONFIG_GLOBAL" = /dev/null
          test "$GIT_ATTR_NOSYSTEM" = 1
          {
            printf 'GIT_CONFIG_NOSYSTEM=%s\n' "$GIT_CONFIG_NOSYSTEM"
            printf 'GIT_CONFIG_GLOBAL=%s\n' "$GIT_CONFIG_GLOBAL"
            printf 'GIT_ATTR_NOSYSTEM=%s\n' "$GIT_ATTR_NOSYSTEM"
            printf 'XDG_CONFIG_HOME=%s\n' "$XDG_CONFIG_HOME"
          } > runner-evidence/git-isolation-env.txt
          {
            printf 'GIT_CONFIG_NOSYSTEM=%s\n' "$GIT_CONFIG_NOSYSTEM"
            printf 'GIT_CONFIG_GLOBAL=%s\n' "$GIT_CONFIG_GLOBAL"
            printf 'GIT_ATTR_NOSYSTEM=%s\n' "$GIT_ATTR_NOSYSTEM"
            printf 'XDG_CONFIG_HOME=%s\n' "$XDG_CONFIG_HOME"
          } >> "$GITHUB_ENV"
          if git config --includes --name-only --get-regexp "$relevant_config" \
            > runner-evidence/git-config-isolated-unsupported.txt; then
            cat runner-evidence/git-config-isolated-unsupported.txt
            exit 1
          else
            status=$?
          fi
          test "$status" -eq 1
          printf 'no unsupported config keys in isolated view\n' \
            >> runner-evidence/git-config-isolated-unsupported.txt
          global_attributes="$(git var GIT_ATTR_GLOBAL)"
          printf '%s\n' "$global_attributes" \
            > runner-evidence/git-attributes-global-isolated.txt
          test "$global_attributes" = "$XDG_CONFIG_HOME/git/attributes"
          test ! -e "$global_attributes"
          printf 'GIT_ATTR_NOSYSTEM=1; system attributes disabled in isolated view\n' \
            > runner-evidence/git-attributes-system-isolated.txt
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
      - name: Record host identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runner-evidence
          {
            sw_vers
            uname -a
            rustc --version --verbose
            cargo --version
            git --version
            diskutil info / | grep -E 'File System Personality|Device Node|Volume Name'
          } > runner-evidence/host.txt
          test "$(uname -m)" = "${{ matrix.arch }}"
          diskutil info / | grep -Eq 'File System Personality: +APFS'
      - name: Record frozen M4 source contract
        shell: bash
        run: |
          set -euo pipefail
          expected_m4_sha='f6c40e79c8efb2620e9561fb972589a76eb37cc6c9da5b83728dccb30d0dbaf8'
          test -n "${GITHUB_SHA:-}"
          head_sha="$(git rev-parse HEAD)"
          actual_m4_sha="$(shasum -a 256 tests/m4_git_parity.rs | awk '{print $1}')"
          {
            printf 'GITHUB_SHA=%s\n' "$GITHUB_SHA"
            printf 'HEAD=%s\n' "$head_sha"
            printf 'tests/m4_git_parity.rs SHA-256=%s\n' "$actual_m4_sha"
          } > runner-evidence/m4-source-contract.log
          test "$head_sha" = "$GITHUB_SHA"
          test "$actual_m4_sha" = "$expected_m4_sha"
      - name: Run full test suite
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --all-targets -- --test-threads=1 --nocapture 2>&1 | tee runner-evidence/tests.log
      - name: Verify M4 APFS evidence
        shell: bash
        run: |
          set -euo pipefail
          : > runner-evidence/m4-gates.log
          grep -Fx 'M4 template crash checkpoints=24' runner-evidence/tests.log | tee -a runner-evidence/m4-gates.log
          grep -Fx 'M4 create crash checkpoints=28' runner-evidence/tests.log | tee -a runner-evidence/m4-gates.log
          grep -Fx 'M4 remove crash checkpoints=10' runner-evidence/tests.log | tee -a runner-evidence/m4-gates.log
          grep -Fx 'M4 crash-prefix targets exercised=62' runner-evidence/tests.log | tee -a runner-evidence/m4-gates.log
          grep -E '^M4 APFS COW dev=' runner-evidence/tests.log | tee -a runner-evidence/m4-gates.log
          grep -F 'M4 macOS raw checkout exit=' runner-evidence/tests.log | tee -a runner-evidence/m4-gates.log
          : > runner-evidence/m4-tests.log
          grep -F 'test checkpoint_protocol_and_all_reachable_crash_prefixes_are_safe ...' runner-evidence/tests.log | tee -a runner-evidence/m4-tests.log
          grep -F 'test exec_preserves_direct_contract_and_n3_sessions_are_isolated_and_leased ...' runner-evidence/tests.log | tee -a runner-evidence/m4-tests.log
          grep -F 'test native_cow_evidence_uses_the_host_storage_oracle ...' runner-evidence/tests.log | tee -a runner-evidence/m4-tests.log
          grep -F 'test ordinary_worktree_and_vws_have_git_parity_for_history_conflicts_and_paths ...' runner-evidence/tests.log | tee -a runner-evidence/m4-tests.log
          test "$(wc -l < runner-evidence/m4-tests.log | tr -d ' ')" = 4
          m4_summary='^test result: ok\. 4 passed; 0 failed; 0 ignored;( 0 measured;)? 0 filtered out; finished in .*$'
          awk -v expected="$m4_summary" '
            /Running .*tests\/m4_git_parity\.rs/ {
              runs += 1
              in_m4 = 1
              next
            }
            in_m4 && /^test result:/ {
              summaries += 1
              if ($0 ~ expected) {
                print
                matches += 1
              }
              in_m4 = 0
            }
            END {
              exit !(runs == 1 && summaries == 1 && matches == 1)
            }
          ' runner-evidence/tests.log | tee -a runner-evidence/m4-tests.log
          if grep -nF 'NOT_EXECUTED' runner-evidence/tests.log > runner-evidence/m4-not-executed.log; then
            cat runner-evidence/m4-not-executed.log
            exit 1
          fi
          printf 'no NOT_EXECUTED\n' >> runner-evidence/m4-not-executed.log
      - name: Build and scan release binary
        shell: bash
        run: |
          set -euo pipefail
          : > runner-evidence/release-rustflags-cleared.log
          for name in RUSTFLAGS CARGO_ENCODED_RUSTFLAGS CARGO_BUILD_RUSTFLAGS; do
            printf '%s\n' "$name" >> runner-evidence/release-rustflags-cleared.log
            unset "$name"
          done
          while IFS= read -r name; do
            printf '%s\n' "$name" >> runner-evidence/release-rustflags-cleared.log
            unset "$name"
          done < <(compgen -e | grep -E '^CARGO_TARGET_.*_RUSTFLAGS$' || true)
          cargo build --locked --release --all-features --bin git-vws 2>&1 | tee runner-evidence/release-build.log
          release_binary=target/release/git-vws
          test -x "$release_binary"
          command -v strings | tee runner-evidence/release-tools.log
          command -v nm | tee -a runner-evidence/release-tools.log
          strings "$release_binary" 2>&1 | tee runner-evidence/release-strings.log
          nm -a "$release_binary" 2>&1 | tee runner-evidence/release-nm.log
          if grep -F -e 'M4CP/1' -e 'GIT_VWS_M4_CONTROL_FD' -e 'GIT_VWS_M4_NONCE' -e 'GIT_VWS_M4_TARGET' -e 'm4_checkpoint' runner-evidence/release-strings.log runner-evidence/release-nm.log > runner-evidence/release-m4-matches.log; then
            cat runner-evidence/release-m4-matches.log
            exit 1
          fi
          printf 'release M4 marker scan: no matches\n' >> runner-evidence/release-m4-matches.log
      - name: Verify Git extension entry point
        shell: bash
        run: |
          set -euo pipefail
          target/release/git-vws --version 2>&1 | tee runner-evidence/release-cli-version.log
          PATH="$PWD/target/release:$PATH" git vws -h 2>&1 | tee runner-evidence/release-cli-help.log
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ci-macos-${{ matrix.asset }}
          path: runner-evidence
          if-no-files-found: error

  linux-native-cow:
    name: Linux XFS FICLONE/FIEMAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          set-safe-directory: false
      - name: Record Git isolation evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runner-evidence
          relevant_config='^(filter|lfs|include(if)?)\.|^core\.attributesfile$'
          record_scope() {
            local scope="$1"
            local output="$2"
            local status
            if git config "$scope" --includes --name-only \
              --get-regexp "$relevant_config" > "$output"; then
              return 0
            else
              status=$?
            fi
            if [ "$status" -ne 1 ]; then
              return "$status"
            fi
            return 0
          }
          record_scope --global runner-evidence/git-config-global-relevant.txt
          record_scope --system runner-evidence/git-config-system-relevant.txt
          isolated_xdg="$RUNNER_TEMP/git-vws-empty-xdg"
          mkdir -p "$isolated_xdg"
          test -z "$(find "$isolated_xdg" -mindepth 1 -maxdepth 1 -print -quit)"
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_CONFIG_GLOBAL=/dev/null
          export GIT_ATTR_NOSYSTEM=1
          export XDG_CONFIG_HOME="$isolated_xdg"
          test "$GIT_CONFIG_NOSYSTEM" = 1
          test "$GIT_CONFIG_GLOBAL" = /dev/null
          test "$GIT_ATTR_NOSYSTEM" = 1
          {
            printf 'GIT_CONFIG_NOSYSTEM=%s\n' "$GIT_CONFIG_NOSYSTEM"
            printf 'GIT_CONFIG_GLOBAL=%s\n' "$GIT_CONFIG_GLOBAL"
            printf 'GIT_ATTR_NOSYSTEM=%s\n' "$GIT_ATTR_NOSYSTEM"
            printf 'XDG_CONFIG_HOME=%s\n' "$XDG_CONFIG_HOME"
          } > runner-evidence/git-isolation-env.txt
          {
            printf 'GIT_CONFIG_NOSYSTEM=%s\n' "$GIT_CONFIG_NOSYSTEM"
            printf 'GIT_CONFIG_GLOBAL=%s\n' "$GIT_CONFIG_GLOBAL"
            printf 'GIT_ATTR_NOSYSTEM=%s\n' "$GIT_ATTR_NOSYSTEM"
            printf 'XDG_CONFIG_HOME=%s\n' "$XDG_CONFIG_HOME"
          } >> "$GITHUB_ENV"
          if git config --includes --name-only --get-regexp "$relevant_config" \
            > runner-evidence/git-config-isolated-unsupported.txt; then
            cat runner-evidence/git-config-isolated-unsupported.txt
            exit 1
          else
            status=$?
          fi
          test "$status" -eq 1
          printf 'no unsupported config keys in isolated view\n' \
            >> runner-evidence/git-config-isolated-unsupported.txt
          global_attributes="$(git var GIT_ATTR_GLOBAL)"
          printf '%s\n' "$global_attributes" \
            > runner-evidence/git-attributes-global-isolated.txt
          test "$global_attributes" = "$XDG_CONFIG_HOME/git/attributes"
          test ! -e "$global_attributes"
          printf 'GIT_ATTR_NOSYSTEM=1; system attributes disabled in isolated view\n' \
            > runner-evidence/git-attributes-system-isolated.txt
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
      - name: Install XFS tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xfsprogs
      - name: Prepare ephemeral XFS reflink volume
        shell: bash
        run: |
          set -euo pipefail
          image="$RUNNER_TEMP/git-vws-xfs.img"
          mountpoint="$RUNNER_TEMP/git-vws-xfs"
          echo "VWS_XFS_IMAGE=$image" >> "$GITHUB_ENV"
          echo "VWS_XFS_MOUNT=$mountpoint" >> "$GITHUB_ENV"
          sudo mkfs.xfs -f -m reflink=1 -d file,name="$image",size=4g
          test -f "$image"
          sudo mkdir -p "$mountpoint"
          sudo mount -o loop "$image" "$mountpoint"
          sudo chown "$(id -u):$(id -g)" "$mountpoint"
          mkdir "$mountpoint/tmp"
          chmod 700 "$mountpoint/tmp"
          echo "TMPDIR=$mountpoint/tmp" >> "$GITHUB_ENV"
      - name: Record host and filesystem identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runner-evidence
          {
            uname -a
            rustc --version --verbose
            cargo --version
            git --version
            findmnt -T "$TMPDIR" -o SOURCE,FSTYPE,OPTIONS
            sudo xfs_info "$VWS_XFS_MOUNT"
          } > runner-evidence/host.txt
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          test "$(findmnt -T "$TMPDIR" -no FSTYPE)" = xfs
          sudo xfs_info "$VWS_XFS_MOUNT" | grep -q 'reflink=1'
      - name: Record frozen M4 source contract
        shell: bash
        run: |
          set -euo pipefail
          expected_m4_sha='f6c40e79c8efb2620e9561fb972589a76eb37cc6c9da5b83728dccb30d0dbaf8'
          test -n "${GITHUB_SHA:-}"
          head_sha="$(git rev-parse HEAD)"
          actual_m4_sha="$(shasum -a 256 tests/m4_git_parity.rs | awk '{print $1}')"
          {
            printf 'GITHUB_SHA=%s\n' "$GITHUB_SHA"
            printf 'HEAD=%s\n' "$head_sha"
            printf 'tests/m4_git_parity.rs SHA-256=%s\n' "$actual_m4_sha"
          } > runner-evidence/m4-source-contract.log
          test "$head_sha" = "$GITHUB_SHA"
          test "$actual_m4_sha" = "$expected_m4_sha"
      - name: Run full test suite on XFS reflink
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --all-targets -- --test-threads=1 --nocapture 2>&1 | tee runner-evidence/tests.log
      - name: Verify M4 XFS evidence
        shell: bash
        run: |
          set -euo pipefail
          : > runner-evidence/m4-gates.log
          grep -Fx 'M4 template crash checkpoints=23' runner-evidence/tests.log | tee -a runner-evidence/m4-gates.log
          grep -Fx 'M4 create crash checkpoints=28' runner-evidence/tests.log | tee -a runner-evidence/m4-gates.log
          grep -Fx 'M4 remove crash checkpoints=10' runner-evidence/tests.log | tee -a runner-evidence/m4-gates.log
          grep -Fx 'M4 crash-prefix targets exercised=61' runner-evidence/tests.log | tee -a runner-evidence/m4-gates.log
          grep -E '^M4 XFS COW dev=' runner-evidence/tests.log | tee -a runner-evidence/m4-gates.log
          : > runner-evidence/m4-tests.log
          grep -F 'test checkpoint_protocol_and_all_reachable_crash_prefixes_are_safe ...' runner-evidence/tests.log | tee -a runner-evidence/m4-tests.log
          grep -F 'test exec_preserves_direct_contract_and_n3_sessions_are_isolated_and_leased ...' runner-evidence/tests.log | tee -a runner-evidence/m4-tests.log
          grep -F 'test native_cow_evidence_uses_the_host_storage_oracle ...' runner-evidence/tests.log | tee -a runner-evidence/m4-tests.log
          grep -F 'test ordinary_worktree_and_vws_have_git_parity_for_history_conflicts_and_paths ...' runner-evidence/tests.log | tee -a runner-evidence/m4-tests.log
          test "$(wc -l < runner-evidence/m4-tests.log | tr -d ' ')" = 4
          m4_summary='^test result: ok\. 4 passed; 0 failed; 0 ignored;( 0 measured;)? 0 filtered out; finished in .*$'
          awk -v expected="$m4_summary" '
            /Running .*tests\/m4_git_parity\.rs/ {
              runs += 1
              in_m4 = 1
              next
            }
            in_m4 && /^test result:/ {
              summaries += 1
              if ($0 ~ expected) {
                print
                matches += 1
              }
              in_m4 = 0
            }
            END {
              exit !(runs == 1 && summaries == 1 && matches == 1)
            }
          ' runner-evidence/tests.log | tee -a runner-evidence/m4-tests.log
          if grep -nF 'NOT_EXECUTED' runner-evidence/tests.log > runner-evidence/m4-not-executed.log; then
            cat runner-evidence/m4-not-executed.log
            exit 1
          fi
          printf 'no NOT_EXECUTED\n' >> runner-evidence/m4-not-executed.log
          raw_attestation='M4 Linux raw-name positive parity attestation: uname=Linux; tests/m4_git_parity.rs SHA-256=f6c40e79c8efb2620e9561fb972589a76eb37cc6c9da5b83728dccb30d0dbaf8; ordinary_worktree_and_vws_have_git_parity_for_history_conflicts_and_paths observed; M4 summary=4 passed, 0 failed, 0 ignored, 0 filtered out'
          printf '%s\n' "$raw_attestation" > runner-evidence/m4-linux-raw-parity-attestation.log
          grep -Fx "$raw_attestation" runner-evidence/m4-linux-raw-parity-attestation.log
          test "$(wc -l < runner-evidence/m4-linux-raw-parity-attestation.log | tr -d ' ')" = 1
      - name: Build and scan release binary
        shell: bash
        run: |
          set -euo pipefail
          : > runner-evidence/release-rustflags-cleared.log
          for name in RUSTFLAGS CARGO_ENCODED_RUSTFLAGS CARGO_BUILD_RUSTFLAGS; do
            printf '%s\n' "$name" >> runner-evidence/release-rustflags-cleared.log
            unset "$name"
          done
          while IFS= read -r name; do
            printf '%s\n' "$name" >> runner-evidence/release-rustflags-cleared.log
            unset "$name"
          done < <(compgen -e | grep -E '^CARGO_TARGET_.*_RUSTFLAGS$' || true)
          cargo build --locked --release --all-features --bin git-vws 2>&1 | tee runner-evidence/release-build.log
          release_binary=target/release/git-vws
          test -x "$release_binary"
          command -v strings | tee runner-evidence/release-tools.log
          command -v nm | tee -a runner-evidence/release-tools.log
          strings "$release_binary" 2>&1 | tee runner-evidence/release-strings.log
          nm -a "$release_binary" 2>&1 | tee runner-evidence/release-nm.log
          if grep -F -e 'M4CP/1' -e 'GIT_VWS_M4_CONTROL_FD' -e 'GIT_VWS_M4_NONCE' -e 'GIT_VWS_M4_TARGET' -e 'm4_checkpoint' runner-evidence/release-strings.log runner-evidence/release-nm.log > runner-evidence/release-m4-matches.log; then
            cat runner-evidence/release-m4-matches.log
            exit 1
          fi
          printf 'release M4 marker scan: no matches\n' >> runner-evidence/release-m4-matches.log
      - name: Verify Git extension entry point
        shell: bash
        run: |
          set -euo pipefail
          target/release/git-vws --version 2>&1 | tee runner-evidence/release-cli-version.log
          PATH="$PWD/target/release:$PATH" git vws -h 2>&1 | tee runner-evidence/release-cli-help.log
      - name: Unmount and remove ephemeral volume
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if mountpoint -q "${VWS_XFS_MOUNT:-}"; then
            sudo umount "$VWS_XFS_MOUNT"
          fi
          if [ -n "${VWS_XFS_MOUNT:-}" ]; then
            sudo rm -rf -- "$VWS_XFS_MOUNT"
            test ! -e "$VWS_XFS_MOUNT"
          fi
          if [ -n "${VWS_XFS_IMAGE:-}" ]; then
            sudo rm -f -- "$VWS_XFS_IMAGE"
            test ! -e "$VWS_XFS_IMAGE"
          fi
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ci-linux-x86_64-xfs-reflink
          path: runner-evidence
          if-no-files-found: error
