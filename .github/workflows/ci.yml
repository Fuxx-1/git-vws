name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          set-safe-directory: false
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --all-targets
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  linux-musl:
    name: Linux musl release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          set-safe-directory: false
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - run: cargo build --locked --release --target x86_64-unknown-linux-musl
      - name: Verify Git extension entry point
        shell: bash
        run: |
          target/x86_64-unknown-linux-musl/release/git-vws --version
          PATH="$PWD/target/x86_64-unknown-linux-musl/release:$PATH" git vws -h

  macos:
    name: macOS APFS (${{ matrix.asset }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            asset: aarch64-apple-darwin
            arch: arm64
          - os: macos-15-intel
            asset: x86_64-apple-darwin
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          set-safe-directory: false
      - name: Record Git wrapper provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runner-evidence
          relevant_config='^(filter|lfs|include(if)?)\.|^core\.attributesfile$'
          record_scope() {
            local scope="$1"
            local output="$2"
            local status
            if git config "$scope" --includes --name-only \
              --get-regexp "$relevant_config" > "$output"; then
              return 0
            else
              status=$?
            fi
            if [ "$status" -ne 1 ]; then
              return "$status"
            fi
            return 0
          }
          record_scope --global runner-evidence/git-config-global-relevant.txt
          record_scope --system runner-evidence/git-config-system-relevant.txt
          real_git="$(command -v git)"
          case "$real_git" in
            /*) ;;
            *) exit 1 ;;
          esac
          test -x "$real_git"
          real_git_version="$("$real_git" --version)"
          real_git_sha="$(shasum -a 256 "$real_git" | awk '{print $1}')"
          isolated_xdg="$RUNNER_TEMP/git-vws-empty-xdg"
          wrapper_dir="$RUNNER_TEMP/git-vws-git-wrapper"
          wrapper_source="runner-evidence/git-wrapper-source.sh"
          wrapper_path="$wrapper_dir/git"
          test ! -e "$isolated_xdg"
          test ! -e "$wrapper_dir"
          test ! -L "$isolated_xdg"
          test ! -L "$wrapper_dir"
          {
            printf 'VWS_GIT_WRAPPER_DIR=%s\n' "$wrapper_dir"
            printf 'VWS_GIT_WRAPPER_PATH=%s\n' "$wrapper_path"
            printf 'VWS_GIT_EMPTY_XDG=%s\n' "$isolated_xdg"
          } >> "$GITHUB_ENV"
          mkdir "$isolated_xdg"
          mkdir "$wrapper_dir"
          test -z "$(find "$isolated_xdg" -mindepth 1 -maxdepth 1 -print -quit)"
          test -z "$(find "$wrapper_dir" -mindepth 1 -maxdepth 1 -print -quit)"
          {
            printf '%s\n' '#!/bin/bash'
            printf '%s\n' 'export GIT_CONFIG_NOSYSTEM=1'
            printf '%s\n' 'export GIT_CONFIG_GLOBAL=/dev/null'
            printf 'export XDG_CONFIG_HOME=%q\n' "$isolated_xdg"
            printf 'exec %q "$@"\n' "$real_git"
          } > "$wrapper_source"
          cp "$wrapper_source" "$wrapper_path"
          chmod 700 "$wrapper_path"
          test -x "$wrapper_path"
          wrapper_source_sha="$(shasum -a 256 "$wrapper_source" | awk '{print $1}')"
          wrapper_copy_sha="$(shasum -a 256 "$wrapper_path" | awk '{print $1}')"
          wrapped_git_version="$("$wrapper_path" --version)"
          {
            printf 'real_git_path=%s\n' "$real_git"
            printf 'real_git_version=%s\n' "$real_git_version"
            printf 'real_git_sha256=%s\n' "$real_git_sha"
            printf 'wrapper_source_sha256=%s\n' "$wrapper_source_sha"
            printf 'wrapper_copy_sha256=%s\n' "$wrapper_copy_sha"
            printf 'wrapped_git_version=%s\n' "$wrapped_git_version"
          } > runner-evidence/git-wrapper-provenance.log
          test "$wrapper_source_sha" = "$wrapper_copy_sha"
          test "$wrapped_git_version" = "$real_git_version"
          wrapped_system_attributes="$("$wrapper_path" var GIT_ATTR_SYSTEM)"
          wrapped_global_attributes="$("$wrapper_path" var GIT_ATTR_GLOBAL)"
          case "$wrapped_system_attributes" in
            /*) ;;
            *) exit 1 ;;
          esac
          case "$wrapped_global_attributes" in
            "$isolated_xdg"/*) ;;
            *) exit 1 ;;
          esac
          {
            printf 'wrapped_system_attributes=%s\n' "$wrapped_system_attributes"
            printf 'wrapped_global_attributes=%s\n' "$wrapped_global_attributes"
          } > runner-evidence/git-wrapper-attributes.log
          test "$wrapped_global_attributes" = "$isolated_xdg/git/attributes"
          test ! -e "$wrapped_system_attributes"
          test ! -e "$wrapped_global_attributes"
          if "$wrapper_path" config --includes --name-only --get-regexp "$relevant_config" \
            > runner-evidence/git-config-isolated-unsupported.txt; then
            cat runner-evidence/git-config-isolated-unsupported.txt
            exit 1
          else
            status=$?
          fi
          test "$status" -eq 1
          printf 'no unsupported config keys in isolated view\n' \
            >> runner-evidence/git-config-isolated-unsupported.txt
          printf '%s\n' "$wrapper_dir" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
      - name: Record host identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runner-evidence
          {
            sw_vers
            uname -a
            rustc --version --verbose
            cargo --version
            git --version
            diskutil info / | grep -E 'File System Personality|Device Node|Volume Name'
          } > runner-evidence/host.txt
          test "$(uname -m)" = "${{ matrix.arch }}"
          diskutil info / | grep -Eq 'File System Personality: +APFS'
      - name: Record frozen M4/M5/M6 source contract
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          printf 'GITHUB_SHA=%s\nHEAD=%s\n' "$GITHUB_SHA" "$head_sha" \
            > runner-evidence/m4-m5-source-contract.log
          test "$head_sha" = "$GITHUB_SHA"
          while read -r path expected; do
            actual="$(shasum -a 256 "$path" | awk '{print $1}')"
            printf '%s SHA-256=%s\n' "$path" "$actual" \
              >> runner-evidence/m4-m5-source-contract.log
            test "$actual" = "$expected"
          done <<'EOF'
          src/authority.rs f924510d658263f350a0d0f34072c6f1965845534f1e67ef0a5c9171f276117d
          src/m4_checkpoint.rs e74b38d5619d88306640bdab263494c6debd87fa561c7983d84d5dbb3f4be0c9
          src/main.rs bd5cf3a6eea65ef11bfda9476fa3353e5854d22154e7c8c52a22b98d4ce2b861
          src/session.rs 72c853e53d4a374eb74b348ef78bcdab56f73b6e9c31f9788771331d3af580ee
          src/storage.rs 3564ebc0ef31e9c4d82f24a8c9c466ba365bd15369f10a18055661fc6a6c7d22
          src/template.rs 89a9f8ccdf11e5162c548f7ea74d0197f70976bd75218d860470e63132bfbbff
          tests/m4_git_parity.rs c28c11f4f4ca98f58f6253591a8cb6acf8664ef90c578176cd44aa020058e56c
          tests/m5_publish.rs c0eff6cdef36e81f8b35fae262037e292d9b3256450d6f85f9982caf7e889057
          tests/m6_maintenance.rs 62bdfdd9986d5ba3379170de6394eb16aa2b5d9611ca52c03be925be9896e4cf
          tests/support/checkpoint.rs c8026cb722d3c0250fc6d403540fd3b78ab18eaac5c881c5e9bb36c8860bef16
          EOF
      - name: Run full test suite
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --all-targets -- --test-threads=1 --nocapture 2>&1 | tee runner-evidence/tests.log
      - name: Verify M4 APFS evidence
        shell: bash
        run: |
          set -euo pipefail
          : > runner-evidence/m4-gates.log
          grep -F 'M4 template crash checkpoints=24' runner-evidence/tests.log | tee -a runner-evidence/m4-gates.log
          grep -Fx 'M4 create crash checkpoints=28' runner-evidence/tests.log | tee -a runner-evidence/m4-gates.log
          grep -Fx 'M4 remove crash checkpoints=10' runner-evidence/tests.log | tee -a runner-evidence/m4-gates.log
          grep -Fx 'M4 crash-prefix targets exercised=62' runner-evidence/tests.log | tee -a runner-evidence/m4-gates.log
          grep -F 'M4 APFS COW dev=' runner-evidence/tests.log | tee -a runner-evidence/m4-gates.log
          grep -F 'M4 macOS raw checkout exit=' runner-evidence/tests.log | tee -a runner-evidence/m4-gates.log
          : > runner-evidence/m4-tests.log
          grep -F 'test checkpoint_protocol_and_all_reachable_crash_prefixes_are_safe ...' runner-evidence/tests.log | tee -a runner-evidence/m4-tests.log
          grep -F 'test exec_preserves_direct_contract_and_n3_sessions_are_isolated_and_leased ...' runner-evidence/tests.log | tee -a runner-evidence/m4-tests.log
          grep -F 'test native_cow_evidence_uses_the_host_storage_oracle ...' runner-evidence/tests.log | tee -a runner-evidence/m4-tests.log
          grep -F 'test ordinary_worktree_and_vws_have_git_parity_for_history_conflicts_and_paths ...' runner-evidence/tests.log | tee -a runner-evidence/m4-tests.log
          test "$(wc -l < runner-evidence/m4-tests.log | tr -d ' ')" = 4
          grep -Fx 'test unsupported_filter_config_rejects_create_without_authority_write ... ok' runner-evidence/tests.log \
            | tee runner-evidence/filter-config-gate.log
          test "$(wc -l < runner-evidence/filter-config-gate.log | tr -d ' ')" = 1
          m4_summary='^test result: ok\. 4 passed; 0 failed; 0 ignored;( 0 measured;)? 0 filtered out; finished in .*$'
          awk -v expected="$m4_summary" '
            /Running.*tests\/m4_git_parity\.rs/ {
              runs += 1
              in_m4 = 1
              next
            }
            in_m4 && /^test result:/ {
              summaries += 1
              if ($0 ~ expected) {
                print
                matches += 1
              }
              in_m4 = 0
            }
            END {
              exit !(runs == 1 && summaries == 1 && matches == 1)
            }
          ' runner-evidence/tests.log | tee -a runner-evidence/m4-tests.log
          if grep -nF 'NOT_EXECUTED' runner-evidence/tests.log > runner-evidence/m4-not-executed.log; then
            cat runner-evidence/m4-not-executed.log
            exit 1
          fi
          printf 'no NOT_EXECUTED\n' >> runner-evidence/m4-not-executed.log
      - name: Verify M5 publish evidence
        shell: bash
        run: |
          set -euo pipefail
          : > runner-evidence/m5-tests.log
          grep -F 'test publish_authority_audit_fixed_oid_and_crash_prefix_contract ...' runner-evidence/tests.log | tee -a runner-evidence/m5-tests.log
          grep -F 'test publish_conflicts_and_compare_and_swap_fences_are_terminal ...' runner-evidence/tests.log | tee -a runner-evidence/m5-tests.log
          grep -F 'test publish_names_new_fast_forwards_and_private_objects_are_retained ...' runner-evidence/tests.log | tee -a runner-evidence/m5-tests.log
          grep -F 'test publish_same_non_fast_forward_and_lease_preserve_lifecycle_contract ...' runner-evidence/tests.log | tee -a runner-evidence/m5-tests.log
          test "$(wc -l < runner-evidence/m5-tests.log | tr -d ' ')" = 4
          m5_summary='^test result: ok\. 4 passed; 0 failed; 0 ignored;( 0 measured;)? 0 filtered out; finished in .*$'
          awk -v expected="$m5_summary" '
            /Running.*tests\/m5_publish\.rs/ {
              runs += 1
              in_m5 = 1
              next
            }
            in_m5 && /^test result:/ {
              summaries += 1
              if ($0 ~ expected) {
                print
                matches += 1
              }
              in_m5 = 0
            }
            END {
              exit !(runs == 1 && summaries == 1 && matches == 1)
            }
          ' runner-evidence/tests.log | tee -a runner-evidence/m5-tests.log
          grep -F 'M5 private_objects_retained=ok' runner-evidence/tests.log \
            | tee runner-evidence/m5-private-objects.log
          test "$(wc -l < runner-evidence/m5-private-objects.log | tr -d ' ')" = 1
          if grep -nF 'NOT_EXECUTED' runner-evidence/tests.log > runner-evidence/m5-not-executed.log; then
            cat runner-evidence/m5-not-executed.log
            exit 1
          fi
          printf 'no NOT_EXECUTED\n' >> runner-evidence/m5-not-executed.log
          {
            printf 'M5 authority_audits=4\n'
            printf 'M5 publish_checkpoints=23\n'
          } > runner-evidence/m5-gates.log
          : > runner-evidence/m6-gates.log
          for name in global_maintenance_cli_and_doctor_are_readonly census_and_leases_fail_closed_without_mutation gc_tombstones_and_crash_prefix_recover_exactly_once private_loose_and_predecessor_temporary_gc_contract; do
            grep -F "test $name ..." runner-evidence/tests.log >> runner-evidence/m6-gates.log
          done
          test "$(wc -l < runner-evidence/m6-gates.log | tr -d ' ')" = 4
          m6_summary='^test result: ok\. 4 passed; 0 failed; 0 ignored;( 0 measured;)? 0 filtered out; finished in .*$'
          awk -v expected="$m6_summary" '
            /Running.*tests\/m6_maintenance\.rs/ { runs++; in_m6=1; next }
            in_m6 && /^test result:/ { summaries++; if ($0 ~ expected) matches++; in_m6=0 }
            END { exit !(runs == 1 && summaries == 1 && matches == 1) }
          ' runner-evidence/tests.log | tee -a runner-evidence/m6-gates.log
          for marker in 'M6 doctor evidence: readonly=ok' 'M6 gc evidence: session=6 template=11 loose+fanout=5 predecessor=3 global=1 total=26' 'M6 private_objects_retained=ok'; do
            count="$(grep -Fxc "$marker" runner-evidence/tests.log || true)"
            test "$count" = 1
            printf '%s\n' "$marker" >> runner-evidence/m6-gates.log
          done
          if grep -qF 'NOT_EXECUTED' runner-evidence/tests.log; then
            exit 1
          fi
      - name: Build and scan release binary
        shell: bash
        run: |
          set -euo pipefail
          : > runner-evidence/release-rustflags-cleared.log
          for name in RUSTFLAGS CARGO_ENCODED_RUSTFLAGS CARGO_BUILD_RUSTFLAGS; do
            printf '%s\n' "$name" >> runner-evidence/release-rustflags-cleared.log
            unset "$name"
          done
          while IFS= read -r name; do
            printf '%s\n' "$name" >> runner-evidence/release-rustflags-cleared.log
            unset "$name"
          done < <(compgen -e | grep -E '^CARGO_TARGET_.*_RUSTFLAGS$' || true)
          cargo build --locked --release --all-features --bin git-vws 2>&1 | tee runner-evidence/release-build.log
          release_binary=target/release/git-vws
          test -x "$release_binary"
          command -v strings | tee runner-evidence/release-tools.log
          command -v nm | tee -a runner-evidence/release-tools.log
          strings "$release_binary" 2>&1 | tee runner-evidence/release-strings.log
          nm -a "$release_binary" 2>&1 | tee runner-evidence/release-nm.log
          if LC_ALL=C grep -aF -e 'M4CP/1' -e 'GIT_VWS_M4_CONTROL_FD' -e 'GIT_VWS_M4_NONCE' -e 'GIT_VWS_M4_TARGET' -e 'object-fetch-returned' -e 'cas-child-returned-success' -e 'cas-child-returned-nonzero' -e 'conflict-aborted-parent-synced' -e 'same-return' -e 'session-tombstone-renamed' -e 'session-tombstone-parent-synced' -e 'session-owned-tree-removed' -e 'record-deletion-unlinked' -e 'record-deletion-parent-synced' -e 'session-return' -e 'template-tombstoned-record-temporary-synced' -e 'template-tombstoned-record-namespace-applied' -e 'template-tombstoned-record-exchange-old-unlinked' -e 'template-tombstoned-record-parent-synced' -e 'template-tombstoned-record' -e 'template-tombstone-renamed' -e 'template-tombstone-parent-synced' -e 'template-owned-tree-removed' -e 'template-return' -e 'loose-object-unlinked' -e 'loose-object-parent-synced' -e 'loose-fanout-unlinked' -e 'loose-fanout-parent-synced' -e 'loose-return' -e 'predecessor-tmp-unlinked' -e 'predecessor-tmp-parent-synced' -e 'predecessor-tmp-removed' "$release_binary" > runner-evidence/release-m4-raw-matches.log; then
            cat runner-evidence/release-m4-raw-matches.log
            exit 1
          fi
          printf 'release raw checkpoint scan: no matches\n' >> runner-evidence/release-m4-raw-matches.log
          if grep -F -e 'M4CP/1' -e 'GIT_VWS_M4_CONTROL_FD' -e 'GIT_VWS_M4_NONCE' -e 'GIT_VWS_M4_TARGET' -e 'm4_checkpoint' -e 'object-fetch-returned' -e 'cas-child-returned-success' -e 'cas-child-returned-nonzero' -e 'conflict-aborted-parent-synced' -e 'same-return' -e 'session-tombstone-renamed' -e 'session-tombstone-parent-synced' -e 'session-owned-tree-removed' -e 'record-deletion-unlinked' -e 'record-deletion-parent-synced' -e 'session-return' -e 'template-tombstoned-record-temporary-synced' -e 'template-tombstoned-record-namespace-applied' -e 'template-tombstoned-record-exchange-old-unlinked' -e 'template-tombstoned-record-parent-synced' -e 'template-tombstoned-record' -e 'template-tombstone-renamed' -e 'template-tombstone-parent-synced' -e 'template-owned-tree-removed' -e 'template-return' -e 'loose-object-unlinked' -e 'loose-object-parent-synced' -e 'loose-fanout-unlinked' -e 'loose-fanout-parent-synced' -e 'loose-return' -e 'predecessor-tmp-unlinked' -e 'predecessor-tmp-parent-synced' -e 'predecessor-tmp-removed' runner-evidence/release-strings.log runner-evidence/release-nm.log > runner-evidence/release-m4-matches.log; then
            cat runner-evidence/release-m4-matches.log
            exit 1
          fi
          printf 'release checkpoint marker scan: no matches\n' >> runner-evidence/release-m4-matches.log
      - name: Verify Git extension entry point
        shell: bash
        run: |
          set -euo pipefail
          target/release/git-vws --version 2>&1 | tee runner-evidence/release-cli-version.log
          PATH="$PWD/target/release:$PATH" git vws -h 2>&1 | tee runner-evidence/release-cli-help.log
      - name: Remove Git wrapper isolation artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cleanup_failed=0
          cleanup_component() {
            local label="$1"
            local path="$2"
            local kind="$3"
            local component_failed=0
            if [ -n "$path" ] && { [ -e "$path" ] || [ -L "$path" ]; }; then
              if [ "$kind" = file ]; then
                rm -f -- "$path" || component_failed=1
              else
                rmdir -- "$path" || component_failed=1
              fi
            fi
            if [ -n "$path" ] && { [ -e "$path" ] || [ -L "$path" ]; }; then
              component_failed=1
            fi
            if [ "$component_failed" -ne 0 ]; then
              printf 'WRAPPER_CLEANUP_FAILED:%s\n' "$label" >&2
              cleanup_failed=1
            fi
          }
          cleanup_component wrapper-file "${VWS_GIT_WRAPPER_PATH:-}" file
          cleanup_component wrapper-dir "${VWS_GIT_WRAPPER_DIR:-}" directory
          cleanup_component empty-xdg "${VWS_GIT_EMPTY_XDG:-}" directory
          if [ "$cleanup_failed" -ne 0 ]; then
            exit 1
          fi
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ci-macos-${{ matrix.asset }}
          path: runner-evidence
          if-no-files-found: error

  linux-native-cow:
    name: Linux XFS FICLONE/FIEMAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          set-safe-directory: false
      - name: Record Git wrapper provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runner-evidence
          relevant_config='^(filter|lfs|include(if)?)\.|^core\.attributesfile$'
          record_scope() {
            local scope="$1"
            local output="$2"
            local status
            if git config "$scope" --includes --name-only \
              --get-regexp "$relevant_config" > "$output"; then
              return 0
            else
              status=$?
            fi
            if [ "$status" -ne 1 ]; then
              return "$status"
            fi
            return 0
          }
          record_scope --global runner-evidence/git-config-global-relevant.txt
          record_scope --system runner-evidence/git-config-system-relevant.txt
          real_git="$(command -v git)"
          case "$real_git" in
            /*) ;;
            *) exit 1 ;;
          esac
          test -x "$real_git"
          real_git_version="$("$real_git" --version)"
          real_git_sha="$(shasum -a 256 "$real_git" | awk '{print $1}')"
          isolated_xdg="$RUNNER_TEMP/git-vws-empty-xdg"
          wrapper_dir="$RUNNER_TEMP/git-vws-git-wrapper"
          wrapper_source="runner-evidence/git-wrapper-source.sh"
          wrapper_path="$wrapper_dir/git"
          test ! -e "$isolated_xdg"
          test ! -e "$wrapper_dir"
          test ! -L "$isolated_xdg"
          test ! -L "$wrapper_dir"
          {
            printf 'VWS_GIT_WRAPPER_DIR=%s\n' "$wrapper_dir"
            printf 'VWS_GIT_WRAPPER_PATH=%s\n' "$wrapper_path"
            printf 'VWS_GIT_EMPTY_XDG=%s\n' "$isolated_xdg"
          } >> "$GITHUB_ENV"
          mkdir "$isolated_xdg"
          mkdir "$wrapper_dir"
          test -z "$(find "$isolated_xdg" -mindepth 1 -maxdepth 1 -print -quit)"
          test -z "$(find "$wrapper_dir" -mindepth 1 -maxdepth 1 -print -quit)"
          {
            printf '%s\n' '#!/bin/bash'
            printf '%s\n' 'export GIT_CONFIG_NOSYSTEM=1'
            printf '%s\n' 'export GIT_CONFIG_GLOBAL=/dev/null'
            printf 'export XDG_CONFIG_HOME=%q\n' "$isolated_xdg"
            printf 'exec %q "$@"\n' "$real_git"
          } > "$wrapper_source"
          cp "$wrapper_source" "$wrapper_path"
          chmod 700 "$wrapper_path"
          test -x "$wrapper_path"
          wrapper_source_sha="$(shasum -a 256 "$wrapper_source" | awk '{print $1}')"
          wrapper_copy_sha="$(shasum -a 256 "$wrapper_path" | awk '{print $1}')"
          wrapped_git_version="$("$wrapper_path" --version)"
          {
            printf 'real_git_path=%s\n' "$real_git"
            printf 'real_git_version=%s\n' "$real_git_version"
            printf 'real_git_sha256=%s\n' "$real_git_sha"
            printf 'wrapper_source_sha256=%s\n' "$wrapper_source_sha"
            printf 'wrapper_copy_sha256=%s\n' "$wrapper_copy_sha"
            printf 'wrapped_git_version=%s\n' "$wrapped_git_version"
          } > runner-evidence/git-wrapper-provenance.log
          test "$wrapper_source_sha" = "$wrapper_copy_sha"
          test "$wrapped_git_version" = "$real_git_version"
          wrapped_system_attributes="$("$wrapper_path" var GIT_ATTR_SYSTEM)"
          wrapped_global_attributes="$("$wrapper_path" var GIT_ATTR_GLOBAL)"
          case "$wrapped_system_attributes" in
            /*) ;;
            *) exit 1 ;;
          esac
          case "$wrapped_global_attributes" in
            "$isolated_xdg"/*) ;;
            *) exit 1 ;;
          esac
          {
            printf 'wrapped_system_attributes=%s\n' "$wrapped_system_attributes"
            printf 'wrapped_global_attributes=%s\n' "$wrapped_global_attributes"
          } > runner-evidence/git-wrapper-attributes.log
          test "$wrapped_global_attributes" = "$isolated_xdg/git/attributes"
          test ! -e "$wrapped_system_attributes"
          test ! -e "$wrapped_global_attributes"
          if "$wrapper_path" config --includes --name-only --get-regexp "$relevant_config" \
            > runner-evidence/git-config-isolated-unsupported.txt; then
            cat runner-evidence/git-config-isolated-unsupported.txt
            exit 1
          else
            status=$?
          fi
          test "$status" -eq 1
          printf 'no unsupported config keys in isolated view\n' \
            >> runner-evidence/git-config-isolated-unsupported.txt
          printf '%s\n' "$wrapper_dir" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
      - name: Install XFS tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xfsprogs
      - name: Prepare ephemeral XFS reflink volume
        shell: bash
        run: |
          set -euo pipefail
          image="$RUNNER_TEMP/git-vws-xfs.img"
          mountpoint="$RUNNER_TEMP/git-vws-xfs"
          echo "VWS_XFS_IMAGE=$image" >> "$GITHUB_ENV"
          echo "VWS_XFS_MOUNT=$mountpoint" >> "$GITHUB_ENV"
          sudo mkfs.xfs -f -m reflink=1 -d file,name="$image",size=4g
          test -f "$image"
          sudo mkdir -p "$mountpoint"
          sudo mount -o loop "$image" "$mountpoint"
          sudo chown "$(id -u):$(id -g)" "$mountpoint"
          mkdir "$mountpoint/tmp"
          chmod 700 "$mountpoint/tmp"
          echo "TMPDIR=$mountpoint/tmp" >> "$GITHUB_ENV"
      - name: Record host and filesystem identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runner-evidence
          {
            uname -a
            rustc --version --verbose
            cargo --version
            git --version
            findmnt -T "$TMPDIR" -o SOURCE,FSTYPE,OPTIONS
            sudo xfs_info "$VWS_XFS_MOUNT"
          } > runner-evidence/host.txt
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          test "$(findmnt -T "$TMPDIR" -no FSTYPE)" = xfs
          sudo xfs_info "$VWS_XFS_MOUNT" | grep -q 'reflink=1'
      - name: Record frozen M4/M5/M6 source contract
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          printf 'GITHUB_SHA=%s\nHEAD=%s\n' "$GITHUB_SHA" "$head_sha" \
            > runner-evidence/m4-m5-source-contract.log
          test "$head_sha" = "$GITHUB_SHA"
          while read -r path expected; do
            actual="$(shasum -a 256 "$path" | awk '{print $1}')"
            printf '%s SHA-256=%s\n' "$path" "$actual" \
              >> runner-evidence/m4-m5-source-contract.log
            test "$actual" = "$expected"
          done <<'EOF'
          src/authority.rs f924510d658263f350a0d0f34072c6f1965845534f1e67ef0a5c9171f276117d
          src/m4_checkpoint.rs e74b38d5619d88306640bdab263494c6debd87fa561c7983d84d5dbb3f4be0c9
          src/main.rs bd5cf3a6eea65ef11bfda9476fa3353e5854d22154e7c8c52a22b98d4ce2b861
          src/session.rs 72c853e53d4a374eb74b348ef78bcdab56f73b6e9c31f9788771331d3af580ee
          src/storage.rs 3564ebc0ef31e9c4d82f24a8c9c466ba365bd15369f10a18055661fc6a6c7d22
          src/template.rs 89a9f8ccdf11e5162c548f7ea74d0197f70976bd75218d860470e63132bfbbff
          tests/m4_git_parity.rs c28c11f4f4ca98f58f6253591a8cb6acf8664ef90c578176cd44aa020058e56c
          tests/m5_publish.rs c0eff6cdef36e81f8b35fae262037e292d9b3256450d6f85f9982caf7e889057
          tests/m6_maintenance.rs 62bdfdd9986d5ba3379170de6394eb16aa2b5d9611ca52c03be925be9896e4cf
          tests/support/checkpoint.rs c8026cb722d3c0250fc6d403540fd3b78ab18eaac5c881c5e9bb36c8860bef16
          EOF
      - name: Run full test suite on XFS reflink
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --all-targets -- --test-threads=1 --nocapture 2>&1 | tee runner-evidence/tests.log
      - name: Verify M4 XFS evidence
        shell: bash
        run: |
          set -euo pipefail
          : > runner-evidence/m4-gates.log
          grep -F 'M4 template crash checkpoints=23' runner-evidence/tests.log | tee -a runner-evidence/m4-gates.log
          grep -Fx 'M4 create crash checkpoints=28' runner-evidence/tests.log | tee -a runner-evidence/m4-gates.log
          grep -Fx 'M4 remove crash checkpoints=10' runner-evidence/tests.log | tee -a runner-evidence/m4-gates.log
          grep -Fx 'M4 crash-prefix targets exercised=61' runner-evidence/tests.log | tee -a runner-evidence/m4-gates.log
          grep -F 'M4 XFS COW dev=' runner-evidence/tests.log | tee -a runner-evidence/m4-gates.log
          : > runner-evidence/m4-tests.log
          grep -F 'test checkpoint_protocol_and_all_reachable_crash_prefixes_are_safe ...' runner-evidence/tests.log | tee -a runner-evidence/m4-tests.log
          grep -F 'test exec_preserves_direct_contract_and_n3_sessions_are_isolated_and_leased ...' runner-evidence/tests.log | tee -a runner-evidence/m4-tests.log
          grep -F 'test native_cow_evidence_uses_the_host_storage_oracle ...' runner-evidence/tests.log | tee -a runner-evidence/m4-tests.log
          grep -F 'test ordinary_worktree_and_vws_have_git_parity_for_history_conflicts_and_paths ...' runner-evidence/tests.log | tee -a runner-evidence/m4-tests.log
          test "$(wc -l < runner-evidence/m4-tests.log | tr -d ' ')" = 4
          grep -Fx 'test unsupported_filter_config_rejects_create_without_authority_write ... ok' runner-evidence/tests.log \
            | tee runner-evidence/filter-config-gate.log
          test "$(wc -l < runner-evidence/filter-config-gate.log | tr -d ' ')" = 1
          m4_summary='^test result: ok\. 4 passed; 0 failed; 0 ignored;( 0 measured;)? 0 filtered out; finished in .*$'
          awk -v expected="$m4_summary" '
            /Running.*tests\/m4_git_parity\.rs/ {
              runs += 1
              in_m4 = 1
              next
            }
            in_m4 && /^test result:/ {
              summaries += 1
              if ($0 ~ expected) {
                print
                matches += 1
              }
              in_m4 = 0
            }
            END {
              exit !(runs == 1 && summaries == 1 && matches == 1)
            }
          ' runner-evidence/tests.log | tee -a runner-evidence/m4-tests.log
          if grep -nF 'NOT_EXECUTED' runner-evidence/tests.log > runner-evidence/m4-not-executed.log; then
            cat runner-evidence/m4-not-executed.log
            exit 1
          fi
          printf 'no NOT_EXECUTED\n' >> runner-evidence/m4-not-executed.log
          raw_attestation='M4 Linux raw-name positive parity attestation: uname=Linux; tests/m4_git_parity.rs SHA-256=c28c11f4f4ca98f58f6253591a8cb6acf8664ef90c578176cd44aa020058e56c; ordinary_worktree_and_vws_have_git_parity_for_history_conflicts_and_paths observed; M4 summary=4 passed, 0 failed, 0 ignored, 0 filtered out'
          printf '%s\n' "$raw_attestation" > runner-evidence/m4-linux-raw-parity-attestation.log
          grep -Fx "$raw_attestation" runner-evidence/m4-linux-raw-parity-attestation.log
          test "$(wc -l < runner-evidence/m4-linux-raw-parity-attestation.log | tr -d ' ')" = 1
      - name: Verify M5 publish evidence
        shell: bash
        run: |
          set -euo pipefail
          : > runner-evidence/m5-tests.log
          grep -F 'test publish_authority_audit_fixed_oid_and_crash_prefix_contract ...' runner-evidence/tests.log | tee -a runner-evidence/m5-tests.log
          grep -F 'test publish_conflicts_and_compare_and_swap_fences_are_terminal ...' runner-evidence/tests.log | tee -a runner-evidence/m5-tests.log
          grep -F 'test publish_names_new_fast_forwards_and_private_objects_are_retained ...' runner-evidence/tests.log | tee -a runner-evidence/m5-tests.log
          grep -F 'test publish_same_non_fast_forward_and_lease_preserve_lifecycle_contract ...' runner-evidence/tests.log | tee -a runner-evidence/m5-tests.log
          test "$(wc -l < runner-evidence/m5-tests.log | tr -d ' ')" = 4
          m5_summary='^test result: ok\. 4 passed; 0 failed; 0 ignored;( 0 measured;)? 0 filtered out; finished in .*$'
          awk -v expected="$m5_summary" '
            /Running.*tests\/m5_publish\.rs/ {
              runs += 1
              in_m5 = 1
              next
            }
            in_m5 && /^test result:/ {
              summaries += 1
              if ($0 ~ expected) {
                print
                matches += 1
              }
              in_m5 = 0
            }
            END {
              exit !(runs == 1 && summaries == 1 && matches == 1)
            }
          ' runner-evidence/tests.log | tee -a runner-evidence/m5-tests.log
          grep -F 'M5 private_objects_retained=ok' runner-evidence/tests.log \
            | tee runner-evidence/m5-private-objects.log
          test "$(wc -l < runner-evidence/m5-private-objects.log | tr -d ' ')" = 1
          if grep -nF 'NOT_EXECUTED' runner-evidence/tests.log > runner-evidence/m5-not-executed.log; then
            cat runner-evidence/m5-not-executed.log
            exit 1
          fi
          printf 'no NOT_EXECUTED\n' >> runner-evidence/m5-not-executed.log
          {
            printf 'M5 authority_audits=4\n'
            printf 'M5 publish_checkpoints=23\n'
          } > runner-evidence/m5-gates.log
          : > runner-evidence/m6-gates.log
          for name in global_maintenance_cli_and_doctor_are_readonly census_and_leases_fail_closed_without_mutation gc_tombstones_and_crash_prefix_recover_exactly_once private_loose_and_predecessor_temporary_gc_contract; do
            grep -F "test $name ..." runner-evidence/tests.log >> runner-evidence/m6-gates.log
          done
          test "$(wc -l < runner-evidence/m6-gates.log | tr -d ' ')" = 4
          m6_summary='^test result: ok\. 4 passed; 0 failed; 0 ignored;( 0 measured;)? 0 filtered out; finished in .*$'
          awk -v expected="$m6_summary" '
            /Running.*tests\/m6_maintenance\.rs/ { runs++; in_m6=1; next }
            in_m6 && /^test result:/ { summaries++; if ($0 ~ expected) matches++; in_m6=0 }
            END { exit !(runs == 1 && summaries == 1 && matches == 1) }
          ' runner-evidence/tests.log | tee -a runner-evidence/m6-gates.log
          for marker in 'M6 doctor evidence: readonly=ok' 'M6 gc evidence: session=6 template=11 loose+fanout=5 predecessor=3 global=1 total=26' 'M6 private_objects_retained=ok'; do
            count="$(grep -Fxc "$marker" runner-evidence/tests.log || true)"
            test "$count" = 1
            printf '%s\n' "$marker" >> runner-evidence/m6-gates.log
          done
          if grep -qF 'NOT_EXECUTED' runner-evidence/tests.log; then
            exit 1
          fi
      - name: Build and scan release binary
        shell: bash
        run: |
          set -euo pipefail
          : > runner-evidence/release-rustflags-cleared.log
          for name in RUSTFLAGS CARGO_ENCODED_RUSTFLAGS CARGO_BUILD_RUSTFLAGS; do
            printf '%s\n' "$name" >> runner-evidence/release-rustflags-cleared.log
            unset "$name"
          done
          while IFS= read -r name; do
            printf '%s\n' "$name" >> runner-evidence/release-rustflags-cleared.log
            unset "$name"
          done < <(compgen -e | grep -E '^CARGO_TARGET_.*_RUSTFLAGS$' || true)
          cargo build --locked --release --all-features --bin git-vws 2>&1 | tee runner-evidence/release-build.log
          release_binary=target/release/git-vws
          test -x "$release_binary"
          command -v strings | tee runner-evidence/release-tools.log
          command -v nm | tee -a runner-evidence/release-tools.log
          strings "$release_binary" 2>&1 | tee runner-evidence/release-strings.log
          nm -a "$release_binary" 2>&1 | tee runner-evidence/release-nm.log
          if LC_ALL=C grep -aF -e 'M4CP/1' -e 'GIT_VWS_M4_CONTROL_FD' -e 'GIT_VWS_M4_NONCE' -e 'GIT_VWS_M4_TARGET' -e 'object-fetch-returned' -e 'cas-child-returned-success' -e 'cas-child-returned-nonzero' -e 'conflict-aborted-parent-synced' -e 'same-return' -e 'session-tombstone-renamed' -e 'session-tombstone-parent-synced' -e 'session-owned-tree-removed' -e 'record-deletion-unlinked' -e 'record-deletion-parent-synced' -e 'session-return' -e 'template-tombstoned-record-temporary-synced' -e 'template-tombstoned-record-namespace-applied' -e 'template-tombstoned-record-exchange-old-unlinked' -e 'template-tombstoned-record-parent-synced' -e 'template-tombstoned-record' -e 'template-tombstone-renamed' -e 'template-tombstone-parent-synced' -e 'template-owned-tree-removed' -e 'template-return' -e 'loose-object-unlinked' -e 'loose-object-parent-synced' -e 'loose-fanout-unlinked' -e 'loose-fanout-parent-synced' -e 'loose-return' -e 'predecessor-tmp-unlinked' -e 'predecessor-tmp-parent-synced' -e 'predecessor-tmp-removed' "$release_binary" > runner-evidence/release-m4-raw-matches.log; then
            cat runner-evidence/release-m4-raw-matches.log
            exit 1
          fi
          printf 'release raw checkpoint scan: no matches\n' >> runner-evidence/release-m4-raw-matches.log
          if grep -F -e 'M4CP/1' -e 'GIT_VWS_M4_CONTROL_FD' -e 'GIT_VWS_M4_NONCE' -e 'GIT_VWS_M4_TARGET' -e 'm4_checkpoint' -e 'object-fetch-returned' -e 'cas-child-returned-success' -e 'cas-child-returned-nonzero' -e 'conflict-aborted-parent-synced' -e 'same-return' -e 'session-tombstone-renamed' -e 'session-tombstone-parent-synced' -e 'session-owned-tree-removed' -e 'record-deletion-unlinked' -e 'record-deletion-parent-synced' -e 'session-return' -e 'template-tombstoned-record-temporary-synced' -e 'template-tombstoned-record-namespace-applied' -e 'template-tombstoned-record-exchange-old-unlinked' -e 'template-tombstoned-record-parent-synced' -e 'template-tombstoned-record' -e 'template-tombstone-renamed' -e 'template-tombstone-parent-synced' -e 'template-owned-tree-removed' -e 'template-return' -e 'loose-object-unlinked' -e 'loose-object-parent-synced' -e 'loose-fanout-unlinked' -e 'loose-fanout-parent-synced' -e 'loose-return' -e 'predecessor-tmp-unlinked' -e 'predecessor-tmp-parent-synced' -e 'predecessor-tmp-removed' runner-evidence/release-strings.log runner-evidence/release-nm.log > runner-evidence/release-m4-matches.log; then
            cat runner-evidence/release-m4-matches.log
            exit 1
          fi
          printf 'release checkpoint marker scan: no matches\n' >> runner-evidence/release-m4-matches.log
      - name: Verify Git extension entry point
        shell: bash
        run: |
          set -euo pipefail
          target/release/git-vws --version 2>&1 | tee runner-evidence/release-cli-version.log
          PATH="$PWD/target/release:$PATH" git vws -h 2>&1 | tee runner-evidence/release-cli-help.log
      - name: Remove Git wrapper isolation artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cleanup_failed=0
          cleanup_component() {
            local label="$1"
            local path="$2"
            local kind="$3"
            local component_failed=0
            if [ -n "$path" ] && { [ -e "$path" ] || [ -L "$path" ]; }; then
              if [ "$kind" = file ]; then
                rm -f -- "$path" || component_failed=1
              else
                rmdir -- "$path" || component_failed=1
              fi
            fi
            if [ -n "$path" ] && { [ -e "$path" ] || [ -L "$path" ]; }; then
              component_failed=1
            fi
            if [ "$component_failed" -ne 0 ]; then
              printf 'WRAPPER_CLEANUP_FAILED:%s\n' "$label" >&2
              cleanup_failed=1
            fi
          }
          cleanup_component wrapper-file "${VWS_GIT_WRAPPER_PATH:-}" file
          cleanup_component wrapper-dir "${VWS_GIT_WRAPPER_DIR:-}" directory
          cleanup_component empty-xdg "${VWS_GIT_EMPTY_XDG:-}" directory
          if [ "$cleanup_failed" -ne 0 ]; then
            exit 1
          fi
      - name: Unmount and remove ephemeral volume
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if mountpoint -q "${VWS_XFS_MOUNT:-}"; then
            sudo umount "$VWS_XFS_MOUNT"
          fi
          if [ -n "${VWS_XFS_MOUNT:-}" ]; then
            sudo rm -rf -- "$VWS_XFS_MOUNT"
            test ! -e "$VWS_XFS_MOUNT"
          fi
          if [ -n "${VWS_XFS_IMAGE:-}" ]; then
            sudo rm -f -- "$VWS_XFS_IMAGE"
            test ! -e "$VWS_XFS_IMAGE"
          fi
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ci-linux-x86_64-xfs-reflink
          path: runner-evidence
          if-no-files-found: error
