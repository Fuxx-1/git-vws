  linux-ext4-loop:
    name: Linux ext4 loop-backed state root
    runs-on: ubuntu-latest
    env:
      # The hosted runner ships a global config with includes, which git-vws
      # rejects by design; isolate it for every step so the repository and the
      # lifecycle are exercised against the same clean configuration.
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_CONFIG_GLOBAL: /dev/null
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          set-safe-directory: false
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
      - name: Install btrfs and loop tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y btrfs-progs e2fsprogs util-linux
      - name: Build release binary
        run: cargo build --locked --release --bin git-vws
      - name: Verify ext4 rejects native COW and names the filesystem
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/ext4-evidence"
          mkdir -p "$evidence"
          image="$RUNNER_TEMP/ext4.img"
          mountpoint="$RUNNER_TEMP/ext4"
          truncate -s 1G "$image"
          sudo mkfs.ext4 -q -F "$image"
          sudo mkdir -p "$mountpoint"
          sudo mount -o loop "$image" "$mountpoint"
          sudo chown "$(id -u):$(id -g)" "$mountpoint"
          export HOME="$mountpoint/home"
          mkdir -p "$HOME"
          # git-vws audits Git with a scrubbed environment, so it reads the
          # system and global config directly. The hosted runner ships a system
          # config containing includes, which git-vws rejects by design; remove
          # it so this job exercises a clean host like the macOS one.
          for cfg in /etc/gitconfig /usr/local/etc/gitconfig "$RUNNER_TEMP"/../gitconfig; do
            if [ -e "$cfg" ]; then
              printf 'removing %s\n' "$cfg" | tee -a "$evidence/host-config.log"
              sudo rm -f "$cfg"
            fi
          done
          git config --system --list 2>&1 | tee -a "$evidence/host-config.log" || true
          git init -q --bare "$mountpoint/repo.git"
          git --git-dir="$mountpoint/repo.git" symbolic-ref HEAD refs/heads/main
          git init -q "$RUNNER_TEMP/seed"
          cd "$RUNNER_TEMP/seed"
          git config user.email ci@example.invalid
          git config user.name CI
          printf 'seed\n' > seed.txt
          git add .
          git commit -qm seed
          git push -q "$mountpoint/repo.git" HEAD:main
          cd "$GITHUB_WORKSPACE"
          binary="$GITHUB_WORKSPACE/target/release/git-vws"
          "$binary" init "$mountpoint/repo.git" | tee "$evidence/init.log"
          set +e
          "$binary" --repo "$mountpoint/repo.git" create native > "$evidence/create.log" 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -F 'ext2/ext3/ext4' "$evidence/create.log" | tee "$evidence/rejection.log"
          grep -F 'reflink' "$evidence/create.log"
      - name: Set up a loop-backed state root and run the full lifecycle
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/ext4-evidence"
          mountpoint="$RUNNER_TEMP/ext4"
          export HOME="$mountpoint/home"
          binary="$GITHUB_WORKSPACE/target/release/git-vws"
          sudo -E env "PATH=$PATH" "HOME=$HOME" "$binary" setup-loop --size 1G --adopt \
            | tee "$evidence/setup-loop.log"
          mountpoint -q "$HOME/.git-vws"
          df -T "$HOME/.git-vws" | tee "$evidence/mounted.log"
          grep -F 'btrfs' "$evidence/mounted.log"
          grep -F 'git-vws loop state root' /etc/fstab | tee "$evidence/fstab.log"
          ls -la "$HOME/.git-vws" | tee "$evidence/state-root-contents.log"
          stat -c '%a %U' "$HOME/.git-vws" | tee -a "$evidence/state-root-contents.log"
          # The record may survive the move unchanged, in which case init reports
          # AUTHORITY_DUPLICATE; that is a healthy registry, not a failure.
          "$binary" forget "$mountpoint/repo.git" --force > "$evidence/forget.log" 2>&1 || true
          cat "$evidence/forget.log"
          "$binary" init "$mountpoint/repo.git" > "$evidence/reinit.log" 2>&1 || true
          cat "$evidence/reinit.log"
          "$binary" doctor --human > "$evidence/doctor-setup.log" 2>&1 || true
          cat "$evidence/doctor-setup.log"
          grep -F '0 finding(s)' "$evidence/doctor-setup.log"
          echo "--- config diagnostics ---" | tee "$evidence/config-diag.log"
          git --git-dir="$mountpoint/repo.git" config --list --show-origin 2>&1 \
            | tee -a "$evidence/config-diag.log"
          env | grep -E '^GIT_' | tee -a "$evidence/config-diag.log" || true
          set +e
          "$binary" --repo "$mountpoint/repo.git" create alpha --target feature/alpha \
            > "$evidence/create-alpha.log" 2>&1
          create_status=$?
          set -e
          cat "$evidence/create-alpha.log"
          printf 'create exit=%s\n' "$create_status" | tee -a "$evidence/create-alpha.log"
          test "$create_status" -eq 0
          "$binary" --repo "$mountpoint/repo.git" exec alpha -- sh -c \
            'echo alpha > alpha.txt; git add -A; git commit -qm alpha'
          "$binary" --repo "$mountpoint/repo.git" create beta --target feature/beta \
            | tee "$evidence/create-beta.log"
          "$binary" --repo "$mountpoint/repo.git" exec beta -- sh -c \
            'echo beta > beta.txt; git add -A; git commit -qm beta'
          "$binary" --repo "$mountpoint/repo.git" list --human | tee "$evidence/list.log"
          "$binary" --repo "$mountpoint/repo.git" publish alpha | tee "$evidence/publish-alpha.log"
          "$binary" --repo "$mountpoint/repo.git" publish beta | tee "$evidence/publish-beta.log"
          git --git-dir="$mountpoint/repo.git" rev-parse refs/heads/feature/alpha
          git --git-dir="$mountpoint/repo.git" rev-parse refs/heads/feature/beta
          "$binary" --repo "$mountpoint/repo.git" remove alpha | tee "$evidence/remove-alpha.log"
          "$binary" --repo "$mountpoint/repo.git" remove beta | tee "$evidence/remove-beta.log"
          "$binary" gc --human | tee "$evidence/gc.log"
          "$binary" doctor --human > "$evidence/doctor-final.log" 2>&1 || true
          cat "$evidence/doctor-final.log"
          grep -F '0 finding(s)' "$evidence/doctor-final.log"
      - name: Verify sessions share physical data through reflinks
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/ext4-evidence"
          mountpoint="$RUNNER_TEMP/ext4"
          export HOME="$mountpoint/home"
          binary="$GITHUB_WORKSPACE/target/release/git-vws"
          head -c 4194304 /dev/urandom > "$mountpoint/repo.git/large.bin"
          git --git-dir="$mountpoint/repo.git" --work-tree="$mountpoint" add -f large.bin
          tree=$(git --git-dir="$mountpoint/repo.git" write-tree)
          commit=$(git --git-dir="$mountpoint/repo.git" commit-tree "$tree" -m "add large file")
          git --git-dir="$mountpoint/repo.git" update-ref refs/heads/main "$commit"
          before=$(df -k --output=used "$HOME/.git-vws" | tail -1 | tr -d ' ')
          "$binary" --repo "$mountpoint/repo.git" create shared-a --target feature/shared \
            | tee "$evidence/create-shared-a.log"
          "$binary" --repo "$mountpoint/repo.git" create shared-b --target feature/shared \
            | tee "$evidence/create-shared-b.log"
          after=$(df -k --output=used "$HOME/.git-vws" | tail -1 | tr -d ' ')
          delta=$((after - before))
          printf 'reflink growth for two 4MiB sessions: %s KiB\n' "$delta" \
            | tee "$evidence/reflink.log"
          # Two sessions sharing one 4 MiB file must not cost two full copies.
          test "$delta" -lt 8192
          "$binary" --repo "$mountpoint/repo.git" remove shared-a --force
          "$binary" --repo "$mountpoint/repo.git" remove shared-b --force
      - name: Grow the state root in place
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/ext4-evidence"
          mountpoint="$RUNNER_TEMP/ext4"
          export HOME="$mountpoint/home"
          binary="$GITHUB_WORKSPACE/target/release/git-vws"
          sudo -E env "PATH=$PATH" "HOME=$HOME" "$binary" loop-resize --size 2G \
            | tee "$evidence/resize.log"
          df -h "$HOME/.git-vws" | tee "$evidence/resized.log"
          "$binary" doctor --human > "$evidence/doctor-resized.log" 2>&1 || true
          cat "$evidence/doctor-resized.log"
          grep -F '0 finding(s)' "$evidence/doctor-resized.log"
      - name: Unmount and confirm doctor explains the missing state root
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/ext4-evidence"
          mountpoint="$RUNNER_TEMP/ext4"
          export HOME="$mountpoint/home"
          binary="$GITHUB_WORKSPACE/target/release/git-vws"
          sudo umount "$HOME/.git-vws"
          set +e
          "$binary" doctor --human > "$evidence/doctor-unmounted.log" 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -F 'not mounted' "$evidence/doctor-unmounted.log" \
            | tee "$evidence/unmounted.log"
          sudo mount "$HOME/.git-vws"
          "$binary" doctor --human > "$evidence/doctor-remounted.log" 2>&1 || true
          cat "$evidence/doctor-remounted.log"
          grep -F '0 finding(s)' "$evidence/doctor-remounted.log"
      - name: Remove loop artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mountpoint="$RUNNER_TEMP/ext4"
          if mountpoint -q "$mountpoint/home/.git-vws"; then
            sudo umount "$mountpoint/home/.git-vws" || true
          fi
          if mountpoint -q "$mountpoint"; then
            sudo umount "$mountpoint" || true
          fi
          sudo sed -i '/# git-vws loop state root/,+1d' /etc/fstab || true
          sudo rm -rf "$mountpoint" "$RUNNER_TEMP/ext4.img" || true
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ci-linux-ext4-loop
          path: ${{ runner.temp }}/ext4-evidence
          if-no-files-found: error
