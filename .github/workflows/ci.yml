name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          set-safe-directory: false
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --all-targets
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  linux-musl:
    name: Linux musl release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          set-safe-directory: false
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - run: cargo build --locked --release --target x86_64-unknown-linux-musl
      - name: Verify Git extension entry point
        shell: bash
        run: |
          target/x86_64-unknown-linux-musl/release/git-vws --version
          PATH="$PWD/target/x86_64-unknown-linux-musl/release:$PATH" git vws -h

  macos:
    name: macOS APFS (${{ matrix.asset }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            asset: aarch64-apple-darwin
            arch: arm64
          - os: macos-15-intel
            asset: x86_64-apple-darwin
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          set-safe-directory: false
      - name: Record Git wrapper provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runner-evidence
          relevant_config='^(filter|lfs|include(if)?)\.|^core\.attributesfile$'
          record_scope() {
            local scope="$1"
            local output="$2"
            local status
            if git config "$scope" --includes --name-only \
              --get-regexp "$relevant_config" > "$output"; then
              return 0
            else
              status=$?
            fi
            if [ "$status" -ne 1 ]; then
              return "$status"
            fi
            return 0
          }
          record_scope --global runner-evidence/git-config-global-relevant.txt
          record_scope --system runner-evidence/git-config-system-relevant.txt
          real_git="$(command -v git)"
          case "$real_git" in
            /*) ;;
            *) exit 1 ;;
          esac
          test -x "$real_git"
          real_git_version="$("$real_git" --version)"
          real_git_sha="$(shasum -a 256 "$real_git" | awk '{print $1}')"
          isolated_xdg="$RUNNER_TEMP/git-vws-empty-xdg"
          wrapper_dir="$RUNNER_TEMP/git-vws-git-wrapper"
          wrapper_source="runner-evidence/git-wrapper-source.sh"
          wrapper_path="$wrapper_dir/git"
          test ! -e "$isolated_xdg"
          test ! -e "$wrapper_dir"
          test ! -L "$isolated_xdg"
          test ! -L "$wrapper_dir"
          {
            printf 'VWS_GIT_WRAPPER_DIR=%s\n' "$wrapper_dir"
            printf 'VWS_GIT_WRAPPER_PATH=%s\n' "$wrapper_path"
            printf 'VWS_GIT_EMPTY_XDG=%s\n' "$isolated_xdg"
          } >> "$GITHUB_ENV"
          mkdir "$isolated_xdg"
          mkdir "$wrapper_dir"
          test -z "$(find "$isolated_xdg" -mindepth 1 -maxdepth 1 -print -quit)"
          test -z "$(find "$wrapper_dir" -mindepth 1 -maxdepth 1 -print -quit)"
          {
            printf '%s\n' '#!/bin/bash'
            printf '%s\n' 'export GIT_CONFIG_NOSYSTEM=1'
            printf '%s\n' 'export GIT_CONFIG_GLOBAL=/dev/null'
            printf 'export XDG_CONFIG_HOME=%q\n' "$isolated_xdg"
            printf 'exec %q "$@"\n' "$real_git"
          } > "$wrapper_source"
          cp "$wrapper_source" "$wrapper_path"
          chmod 700 "$wrapper_path"
          test -x "$wrapper_path"
          wrapper_source_sha="$(shasum -a 256 "$wrapper_source" | awk '{print $1}')"
          wrapper_copy_sha="$(shasum -a 256 "$wrapper_path" | awk '{print $1}')"
          wrapped_git_version="$("$wrapper_path" --version)"
          {
            printf 'real_git_path=%s\n' "$real_git"
            printf 'real_git_version=%s\n' "$real_git_version"
            printf 'real_git_sha256=%s\n' "$real_git_sha"
            printf 'wrapper_source_sha256=%s\n' "$wrapper_source_sha"
            printf 'wrapper_copy_sha256=%s\n' "$wrapper_copy_sha"
            printf 'wrapped_git_version=%s\n' "$wrapped_git_version"
          } > runner-evidence/git-wrapper-provenance.log
          test "$wrapper_source_sha" = "$wrapper_copy_sha"
          test "$wrapped_git_version" = "$real_git_version"
          wrapped_system_attributes="$("$wrapper_path" var GIT_ATTR_SYSTEM)"
          wrapped_global_attributes="$("$wrapper_path" var GIT_ATTR_GLOBAL)"
          case "$wrapped_system_attributes" in
            /*) ;;
            *) exit 1 ;;
          esac
          case "$wrapped_global_attributes" in
            "$isolated_xdg"/*) ;;
            *) exit 1 ;;
          esac
          {
            printf 'wrapped_system_attributes=%s\n' "$wrapped_system_attributes"
            printf 'wrapped_global_attributes=%s\n' "$wrapped_global_attributes"
          } > runner-evidence/git-wrapper-attributes.log
          test "$wrapped_global_attributes" = "$isolated_xdg/git/attributes"
          test ! -e "$wrapped_system_attributes"
          test ! -e "$wrapped_global_attributes"
          if "$wrapper_path" config --includes --name-only --get-regexp "$relevant_config" \
            > runner-evidence/git-config-isolated-unsupported.txt; then
            cat runner-evidence/git-config-isolated-unsupported.txt
            exit 1
          else
            status=$?
          fi
          test "$status" -eq 1
          printf 'no unsupported config keys in isolated view\n' \
            >> runner-evidence/git-config-isolated-unsupported.txt
          printf '%s\n' "$wrapper_dir" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
      - name: Record host identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runner-evidence
          {
            sw_vers
            uname -a
            rustc --version --verbose
            cargo --version
            git --version
            diskutil info / | grep -E 'File System Personality|Device Node|Volume Name'
          } > runner-evidence/host.txt
          test "$(uname -m)" = "${{ matrix.arch }}"
          diskutil info / | grep -Eq 'File System Personality: +APFS'
      - name: Record frozen M4 source contract
        shell: bash
        run: |
          set -euo pipefail
          expected_m4_sha='9ce8beb6f1327afd12bb97eb0de605d81446ea5508c2cd4e2a8fb1561f3993c6'
          test -n "${GITHUB_SHA:-}"
          head_sha="$(git rev-parse HEAD)"
          actual_m4_sha="$(shasum -a 256 tests/m4_git_parity.rs | awk '{print $1}')"
          {
            printf 'GITHUB_SHA=%s\n' "$GITHUB_SHA"
            printf 'HEAD=%s\n' "$head_sha"
            printf 'tests/m4_git_parity.rs SHA-256=%s\n' "$actual_m4_sha"
          } > runner-evidence/m4-source-contract.log
          test "$head_sha" = "$GITHUB_SHA"
          test "$actual_m4_sha" = "$expected_m4_sha"
      - name: Run full test suite
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --all-targets -- --test-threads=1 --nocapture 2>&1 | tee runner-evidence/tests.log
      - name: Verify M4 APFS evidence
        shell: bash
        run: |
          set -euo pipefail
          : > runner-evidence/m4-gates.log
          grep -Fx 'M4 template crash checkpoints=24' runner-evidence/tests.log | tee -a runner-evidence/m4-gates.log
          grep -Fx 'M4 create crash checkpoints=28' runner-evidence/tests.log | tee -a runner-evidence/m4-gates.log
          grep -Fx 'M4 remove crash checkpoints=10' runner-evidence/tests.log | tee -a runner-evidence/m4-gates.log
          grep -Fx 'M4 crash-prefix targets exercised=62' runner-evidence/tests.log | tee -a runner-evidence/m4-gates.log
          grep -E '^M4 APFS COW dev=' runner-evidence/tests.log | tee -a runner-evidence/m4-gates.log
          grep -F 'M4 macOS raw checkout exit=' runner-evidence/tests.log | tee -a runner-evidence/m4-gates.log
          : > runner-evidence/m4-tests.log
          grep -F 'test checkpoint_protocol_and_all_reachable_crash_prefixes_are_safe ...' runner-evidence/tests.log | tee -a runner-evidence/m4-tests.log
          grep -F 'test exec_preserves_direct_contract_and_n3_sessions_are_isolated_and_leased ...' runner-evidence/tests.log | tee -a runner-evidence/m4-tests.log
          grep -F 'test native_cow_evidence_uses_the_host_storage_oracle ...' runner-evidence/tests.log | tee -a runner-evidence/m4-tests.log
          grep -F 'test ordinary_worktree_and_vws_have_git_parity_for_history_conflicts_and_paths ...' runner-evidence/tests.log | tee -a runner-evidence/m4-tests.log
          test "$(wc -l < runner-evidence/m4-tests.log | tr -d ' ')" = 4
          grep -Fx 'test unsupported_filter_config_rejects_create_without_authority_write ... ok' runner-evidence/tests.log \
            | tee runner-evidence/filter-config-gate.log
          test "$(wc -l < runner-evidence/filter-config-gate.log | tr -d ' ')" = 1
          m4_summary='^test result: ok\. 4 passed; 0 failed; 0 ignored;( 0 measured;)? 0 filtered out; finished in .*$'
          awk -v expected="$m4_summary" '
            /Running .*tests\/m4_git_parity\.rs/ {
              runs += 1
              in_m4 = 1
              next
            }
            in_m4 && /^test result:/ {
              summaries += 1
              if ($0 ~ expected) {
                print
                matches += 1
              }
              in_m4 = 0
            }
            END {
              exit !(runs == 1 && summaries == 1 && matches == 1)
            }
          ' runner-evidence/tests.log | tee -a runner-evidence/m4-tests.log
          if grep -nF 'NOT_EXECUTED' runner-evidence/tests.log > runner-evidence/m4-not-executed.log; then
            cat runner-evidence/m4-not-executed.log
            exit 1
          fi
          printf 'no NOT_EXECUTED\n' >> runner-evidence/m4-not-executed.log
      - name: Build and scan release binary
        shell: bash
        run: |
          set -euo pipefail
          : > runner-evidence/release-rustflags-cleared.log
          for name in RUSTFLAGS CARGO_ENCODED_RUSTFLAGS CARGO_BUILD_RUSTFLAGS; do
            printf '%s\n' "$name" >> runner-evidence/release-rustflags-cleared.log
            unset "$name"
          done
          while IFS= read -r name; do
            printf '%s\n' "$name" >> runner-evidence/release-rustflags-cleared.log
            unset "$name"
          done < <(compgen -e | grep -E '^CARGO_TARGET_.*_RUSTFLAGS$' || true)
          cargo build --locked --release --all-features --bin git-vws 2>&1 | tee runner-evidence/release-build.log
          release_binary=target/release/git-vws
          test -x "$release_binary"
          command -v strings | tee runner-evidence/release-tools.log
          command -v nm | tee -a runner-evidence/release-tools.log
          strings "$release_binary" 2>&1 | tee runner-evidence/release-strings.log
          nm -a "$release_binary" 2>&1 | tee runner-evidence/release-nm.log
          if grep -F -e 'M4CP/1' -e 'GIT_VWS_M4_CONTROL_FD' -e 'GIT_VWS_M4_NONCE' -e 'GIT_VWS_M4_TARGET' -e 'm4_checkpoint' runner-evidence/release-strings.log runner-evidence/release-nm.log > runner-evidence/release-m4-matches.log; then
            cat runner-evidence/release-m4-matches.log
            exit 1
          fi
          printf 'release M4 marker scan: no matches\n' >> runner-evidence/release-m4-matches.log
      - name: Verify Git extension entry point
        shell: bash
        run: |
          set -euo pipefail
          target/release/git-vws --version 2>&1 | tee runner-evidence/release-cli-version.log
          PATH="$PWD/target/release:$PATH" git vws -h 2>&1 | tee runner-evidence/release-cli-help.log
      - name: Remove Git wrapper isolation artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cleanup_failed=0
          cleanup_component() {
            local label="$1"
            local path="$2"
            local kind="$3"
            local component_failed=0
            if [ -n "$path" ] && { [ -e "$path" ] || [ -L "$path" ]; }; then
              if [ "$kind" = file ]; then
                rm -f -- "$path" || component_failed=1
              else
                rmdir -- "$path" || component_failed=1
              fi
            fi
            if [ -n "$path" ] && { [ -e "$path" ] || [ -L "$path" ]; }; then
              component_failed=1
            fi
            if [ "$component_failed" -ne 0 ]; then
              printf 'WRAPPER_CLEANUP_FAILED:%s\n' "$label" >&2
              cleanup_failed=1
            fi
          }
          cleanup_component wrapper-file "${VWS_GIT_WRAPPER_PATH:-}" file
          cleanup_component wrapper-dir "${VWS_GIT_WRAPPER_DIR:-}" directory
          cleanup_component empty-xdg "${VWS_GIT_EMPTY_XDG:-}" directory
          if [ "$cleanup_failed" -ne 0 ]; then
            exit 1
          fi
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ci-macos-${{ matrix.asset }}
          path: runner-evidence
          if-no-files-found: error

  linux-native-cow:
    name: Linux XFS FICLONE/FIEMAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          set-safe-directory: false
      - name: Record Git wrapper provenance
        shell: bash
        run: |
          set -euo pipefail
