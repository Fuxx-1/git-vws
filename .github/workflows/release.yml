name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  validate-tag:
    name: Validate annotated release contract
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.contract.outputs.version }}
      source-date-epoch: ${{ steps.contract.outputs.source-date-epoch }}
      tag-object-sha: ${{ steps.contract.outputs.tag-object-sha }}
      pretag-run-id: ${{ steps.contract.outputs.pretag-run-id }}
      pretag-run-attempt: ${{ steps.contract.outputs.pretag-run-attempt }}
      signer-workflow-sha: ${{ steps.contract.outputs.signer-workflow-sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
          set-safe-directory: false
      - uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315
      - id: contract
        name: Validate tag, source, signer anchor, and pre-tag CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json,subprocess; data=json.loads(subprocess.check_output(["cargo","metadata","--locked","--no-deps","--format-version","1"])); print(data["packages"][0]["version"])')"
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$ ]]; then
            printf 'release tag is not a semantic prerelease: %s\n' "$GITHUB_REF_NAME" >&2
            exit 1
          fi
          test "$GITHUB_REF_NAME" = "v$version"
          tag_ref="refs/tags/$GITHUB_REF_NAME"
          test "$(git cat-file -t "$tag_ref")" = tag
          tag_object_sha="$(git rev-parse "$tag_ref")"
          source_sha="$(git rev-parse "$tag_ref^{commit}")"
          test "$source_sha" = "$GITHUB_SHA"
          epoch="$(git show -s --format=%ct "$source_sha")"
          test "$epoch" -gt 0
          annotation="$RUNNER_TEMP/tag-annotation.txt"
          git cat-file tag "$tag_object_sha" | sed '1,/^$/d' > "$annotation"
          python3 .github/scripts/release.py validate-tag \
            --version "$version" \
            --source-sha "$source_sha" \
            --tag-ref "$tag_ref" \
            --tag-object-sha "$tag_object_sha" \
            --annotation "$annotation" \
            --workflow-file .github/workflows/release.yml \
            --output "$RUNNER_TEMP/tag-contract.json"
          pretag_run_id="$(jq -er .pretag_run_id "$RUNNER_TEMP/tag-contract.json")"
          pretag_run_attempt="$(jq -er .pretag_run_attempt "$RUNNER_TEMP/tag-contract.json")"
          signer_workflow_sha="$(jq -er .signer_workflow_sha "$RUNNER_TEMP/tag-contract.json")"
          pretag_run="$RUNNER_TEMP/pretag-run.json"
          pretag_jobs="$RUNNER_TEMP/pretag-jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$pretag_run_id/attempts/$pretag_run_attempt" > "$pretag_run"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$pretag_run_id/attempts/$pretag_run_attempt/jobs?per_page=100" > "$pretag_jobs"
          jq -e --arg sha "$source_sha" --arg attempt "$pretag_run_attempt" '
            .path == ".github/workflows/ci.yml"
            and .head_sha == $sha
            and .head_branch == "main"
            and .event == "push"
            and .conclusion == "success"
            and (.run_attempt | tostring) == $attempt
          ' "$pretag_run" > /dev/null
          jq -n --slurpfile run "$pretag_run" --slurpfile jobs "$pretag_jobs" --arg run_id "$pretag_run_id" --arg attempt "$pretag_run_attempt" '
            def one($name):
              [$jobs[0].jobs[] | select(.name == $name or (.name | endswith("/ " + $name)))] as $matches
              | if $matches | length == 1 then
                  $matches[0] as $job
                  | {
                      name: $name,
                      id: ($job.id | tostring),
                      conclusion: $job.conclusion,
                      startedAt: $job.started_at,
                      completedAt: $job.completed_at,
                      runnerLabels: $job.labels
                    }
                else error("missing or duplicate CI job " + $name)
                end;
            {
              workflowPath: ".github/workflows/ci.yml",
              run: {
                id: $run_id,
                attempt: $attempt,
                headSha: $run[0].head_sha,
                event: $run[0].event,
                ref: ("refs/heads/" + $run[0].head_branch),
                conclusion: $run[0].conclusion
              },
              jobs: [
                "Quality",
                "Linux musl release build",
                "macOS APFS (aarch64-apple-darwin)",
                "macOS APFS (x86_64-apple-darwin)",
                "Linux XFS FICLONE/FIEMAP"
              ] | map(one(.))
            }
          ' > "$RUNNER_TEMP/pretag-evidence.json"
          python3 .github/scripts/release.py validate-pretag \
            --input "$RUNNER_TEMP/pretag-evidence.json" \
            --output "$RUNNER_TEMP/pretag-canonical.json" \
            --version "$version" \
            --source-sha "$source_sha" \
            --pretag-run-id "$pretag_run_id" \
            --pretag-run-attempt "$pretag_run_attempt"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'source-date-epoch=%s\n' "$epoch" >> "$GITHUB_OUTPUT"
          printf 'tag-object-sha=%s\n' "$tag_object_sha" >> "$GITHUB_OUTPUT"
          printf 'pretag-run-id=%s\n' "$pretag_run_id" >> "$GITHUB_OUTPUT"
          printf 'pretag-run-attempt=%s\n' "$pretag_run_attempt" >> "$GITHUB_OUTPUT"
          printf 'signer-workflow-sha=%s\n' "$signer_workflow_sha" >> "$GITHUB_OUTPUT"

  metadata:
    name: Generate release metadata
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          set-safe-directory: false
      - uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315
      - name: Generate SPDX and license inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/release.py common \
            --output release-common \
            --version '${{ needs.validate-tag.outputs.version }}' \
            --source-sha "$GITHUB_SHA" \
            --epoch '${{ needs.validate-tag.outputs.source-date-epoch }}'
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: release-common
          path: release-common
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build ${{ matrix.target }}
    needs: [validate-tag, metadata]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          set-safe-directory: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: release-common
          path: release-common
      - uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux release tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils file musl-tools
      - name: Build release binary
        shell: bash
        run: |
          set -euo pipefail
          unset RUSTFLAGS CARGO_ENCODED_RUSTFLAGS CARGO_BUILD_RUSTFLAGS
          while IFS= read -r variable; do
            unset "$variable"
          done < <(compgen -e | grep -E '^CARGO_TARGET_.*_RUSTFLAGS$' || true)
          cargo build --locked --release --all-features \
            --target '${{ matrix.target }}' --bin git-vws
      - name: Verify and package native archive
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/release.py package \
            --output release-output \
            --common release-common \
            --version '${{ needs.validate-tag.outputs.version }}' \
            --source-sha "$GITHUB_SHA" \
            --epoch '${{ needs.validate-tag.outputs.source-date-epoch }}' \
            --target '${{ matrix.target }}' \
            --binary 'target/${{ matrix.target }}/release/git-vws'
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: release-${{ matrix.target }}
          path: release-output
          if-no-files-found: error
          retention-days: 1

  assembly:
    name: Assemble unsigned release closure
    needs: [validate-tag, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          set-safe-directory: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          path: release-input
          pattern: release-*
          merge-multiple: true
      - name: Assemble exact unsigned assets
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/release.py assemble \
            --directory release-input \
            --version '${{ needs.validate-tag.outputs.version }}' \
            --source-sha "$GITHUB_SHA"
          mkdir -p release-assembly/assets
          cp release-input/* release-assembly/assets/
          test -z "$(find release-assembly -type l -print -quit)"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: release-assembly
          path: release-assembly
          if-no-files-found: error
          retention-days: 1

  sign:
    name: Sign immutable release provenance
    needs: [validate-tag, assembly]
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    uses: Fuxx-1/git-vws/.github/workflows/release-sign.yml@__SIGNER_SHA__

  draft:
    name: Create verified draft release
    needs: [validate-tag, sign]
    runs-on: ubuntu-latest
    permissions:
      attestations: read
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          set-safe-directory: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: release-signed
          path: release-assets
      - name: Verify public provenance and exact asset closure
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNER_SHA: ${{ needs.validate-tag.outputs.signer-workflow-sha }}
        run: |
          set -euo pipefail
          bundle=release-assets/PROVENANCE.sigstore.json
          test -f "$bundle"
          for asset in release-assets/*; do
            if [ "$asset" = "$bundle" ]; then
              continue
            fi
            gh attestation verify "$asset" \
              --bundle "$bundle" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-sign.yml" \
              --signer-digest "$SIGNER_SHA" \
              --source-digest "$GITHUB_SHA" \
              --source-ref "$GITHUB_REF" \
              --deny-self-hosted-runners
          done
          python3 .github/scripts/release.py verify-provenance \
            --directory release-assets \
            --version '${{ needs.validate-tag.outputs.version }}' \
            --source-sha "$GITHUB_SHA"
      - name: Replace draft assets with the exact signed closure
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNER_SHA: ${{ needs.validate-tag.outputs.signer-workflow-sha }}
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.txt"
          {
            printf 'Alpha release of git-vws %s.\n\n' "$VERSION"
            printf 'Implemented commands: init, create, list, exec, remove, publish, gc, doctor.\n'
            printf 'Supported hosts: macOS APFS and Linux filesystems that pass FICLONE/FIEMAP validation.\n'
            printf 'No FUSE, kernel extension, administrator installation, daemon, or full-copy fallback is used.\n'
            printf 'Windows remains unsupported in this release.\n\n'
            printf 'Every asset is covered by a GitHub artifact attestation signed through the public Sigstore service.\n'
            printf 'The release includes the exact Sigstore bundle as PROVENANCE.sigstore.json.\n\n'
            printf 'Source commit: %s\n' "$GITHUB_SHA"
            printf 'Signer workflow commit: %s\n' "$SIGNER_SHA"
            printf 'Pre-release CI run: %s/%s/actions/runs/%s/attempts/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" '${{ needs.validate-tag.outputs.pretag-run-id }}' '${{ needs.validate-tag.outputs.pretag-run-attempt }}'
            printf 'Release workflow run: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } > "$notes"
          if gh release view "$GITHUB_REF_NAME" --json isDraft,assets > "$RUNNER_TEMP/release-before.json" 2>/dev/null; then
            test "$(jq -r .isDraft "$RUNNER_TEMP/release-before.json")" = true
            while IFS= read -r asset; do
              gh release delete-asset "$GITHUB_REF_NAME" "$asset" --yes
            done < <(jq -r '.assets[].name' "$RUNNER_TEMP/release-before.json")
            gh release edit "$GITHUB_REF_NAME" --title "git-vws $VERSION" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "git-vws $VERSION" --notes-file "$notes"
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/*
          gh release view "$GITHUB_REF_NAME" --json isDraft,assets > "$RUNNER_TEMP/release-after.json"
          test "$(jq -r .isDraft "$RUNNER_TEMP/release-after.json")" = true
          python3 - release-assets "$RUNNER_TEMP/release-after.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          local = sorted(path.name for path in Path(sys.argv[1]).iterdir())
          remote = sorted(
              asset["name"]
              for asset in json.load(open(sys.argv[2], encoding="utf-8"))["assets"]
          )
          if local != remote:
              raise SystemExit(f"draft asset set mismatch: local={local} remote={remote}")
          PY

  verify:
    name: Verify draft on ${{ matrix.target }}
    needs: [validate-tag, draft]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    permissions:
      attestations: read
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          set-safe-directory: false
      - name: Install Linux verification tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils file
      - name: Download exact draft assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true
          mkdir release-download
          gh release download "$GITHUB_REF_NAME" --dir release-download
      - name: Verify provenance, archive safety, and native binary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNER_SHA: ${{ needs.validate-tag.outputs.signer-workflow-sha }}
        run: |
          set -euo pipefail
          bundle=release-download/PROVENANCE.sigstore.json
          test -f "$bundle"
          for asset in release-download/*; do
            if [ "$asset" = "$bundle" ]; then
              continue
            fi
            gh attestation verify "$asset" \
              --bundle "$bundle" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-sign.yml" \
              --signer-digest "$SIGNER_SHA" \
              --source-digest "$GITHUB_SHA" \
              --source-ref "$GITHUB_REF" \
              --deny-self-hosted-runners
          done
          python3 .github/scripts/release.py verify \
            --directory release-download \
            --version '${{ needs.validate-tag.outputs.version }}' \
            --source-sha "$GITHUB_SHA" \
            --target '${{ matrix.target }}'

  promote:
    name: Promote verified draft to prerelease
    needs: [validate-tag, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Promote only after all verification jobs pass
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true
          gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = false
          test "$(gh release view "$GITHUB_REF_NAME" --json isPrerelease --jq .isPrerelease)" = true
