name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.85.0
      - id: version
        name: Match tag to Cargo package version
        shell: bash
        run: |
          version="$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo version $version" >&2
            exit 1
          fi
          case "$version" in
            *-*) ;;
            *) echo "alpha workflow only publishes prerelease versions" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

  validation:
    name: Validate macOS/Linux on release commit
    needs: validate-tag
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build ${{ matrix.asset }}
    needs: [validate-tag, validation]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: x86_64-unknown-linux-musl
            binary: git-vws
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: x86_64-apple-darwin
            binary: git-vws
          - os: macos-15
            target: aarch64-apple-darwin
            asset: aarch64-apple-darwin
            binary: git-vws
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Build release binary
        shell: bash
        run: |
          unset RUSTFLAGS CARGO_ENCODED_RUSTFLAGS CARGO_BUILD_RUSTFLAGS
          for variable in "${!CARGO_TARGET_@}"; do
            [[ "$variable" == *_RUSTFLAGS ]] && unset "$variable"
          done
          cargo build --locked --release --all-features --target ${{ matrix.target }} --bin git-vws
      - name: Reject checkpoint controls
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          if ! strings_output="$(strings "$binary")"; then
            echo "cannot inspect release binary strings" >&2
            exit 1
          fi
          if grep -F -e 'M4CP/1' -e 'GIT_VWS_M4_CONTROL_FD' -e 'GIT_VWS_M4_NONCE' -e 'GIT_VWS_M4_TARGET' <<<"$strings_output"; then
            echo "release binary retains M4 checkpoint controls" >&2
            exit 1
          fi
          if ! symbols="$(nm -a "$binary")"; then
            echo "cannot inspect release binary symbols" >&2
            exit 1
          fi
          if grep -F 'm4_checkpoint' <<<"$symbols"; then
            echo "release binary retains M4 checkpoint symbols" >&2
            exit 1
          fi
      - name: Verify native binary
        shell: bash
        run: |
          target/${{ matrix.target }}/release/${{ matrix.binary }} --version
          PATH="$PWD/target/${{ matrix.target }}/release:$PATH" git vws -h
      - name: Package archive
        shell: bash
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          package="git-vws-v${VERSION}-${{ matrix.asset }}"
          mkdir -p "$package"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$package/"
          cp README.md LICENSE LICENSE-MIT LICENSE-APACHE "$package/"
          tar -czf "$package.tar.gz" "$package"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$package.tar.gz" > "$package.tar.gz.sha256"
            sha256sum -c "$package.tar.gz.sha256"
          else
            shasum -a 256 "$package.tar.gz" > "$package.tar.gz.sha256"
            shasum -a 256 -c "$package.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: release-${{ matrix.asset }}
          path: |
            git-vws-v${{ needs.validate-tag.outputs.version }}-${{ matrix.asset }}.tar.gz
            git-vws-v${{ needs.validate-tag.outputs.version }}-${{ matrix.asset }}.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: Publish prerelease
    needs: [validate-tag, validation, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true
      - name: Create combined checksum manifest
        working-directory: release-assets
        shell: bash
        run: |
          set -euo pipefail
          for checksum in *.tar.gz.sha256; do
            sha256sum -c "$checksum"
          done
          sha256sum *.tar.gz > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Create GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          notes="$(mktemp)"
          {
            echo "Alpha release of git-vws ${VERSION}."
            echo
            echo "Implemented: bare authority initialization and native-COW session creation."
            echo "Not implemented: list, exec, remove, publish, gc, doctor, and Windows support."
            echo
            echo "Validation and build run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > "$notes"
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --prerelease \
            --title "git-vws ${VERSION}" \
            --notes-file "$notes" \
            release-assets/*.tar.gz \
            release-assets/*.tar.gz.sha256 \
            release-assets/SHA256SUMS
