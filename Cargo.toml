[package]
name = "git-vws"
version = "1.0.2"
edition = "2021"
rust-version = "1.85"
description = "Native copy-on-write virtual Git worktrees"
license = "GPL-3.0-only"
readme = "README.md"
repository = "https://github.com/Fuxx-1/git-vws"
homepage = "https://github.com/Fuxx-1/git-vws"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
libc = "=0.2.189"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(git_vws_m4_checkpoint)'] }

[[bin]]
name = "git-vws"
path = "src/main.rs"
