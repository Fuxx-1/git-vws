[package]
name = "git-vws"
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.85"
description = "Virtual Git worktree bootstrap"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/Fuxx-1/git-vws"
homepage = "https://github.com/Fuxx-1/git-vws"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
libc = "=0.2.189"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"

[[bin]]
name = "git-vws"
path = "src/main.rs"
